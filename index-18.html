<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физтренажёр</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with tabs, one centred reading column (max 860px) on a squared-notebook ground. */
:root{
  --bg:#EEF2F7; --grid:#DCE3ED; --surface:#FFFFFF; --ink:#142033; --muted:#566478; --line:#D3DBE6;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E5ECFD;
  --good:#17703F; --good-soft:#E1F3E8; --bad:#B42318; --bad-soft:#FCE9E7;
  --s1:#1F4FD8; --s2:#C2410C; --s3:#0E7C6B; --s4:#9D2BA8;
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1521; --grid:#16212F; --surface:#151F2E; --ink:#E7EDF6; --muted:#9AA8BA; --line:#27364A;
  --accent:#7FA2FF; --accent-ink:#0D1521; --accent-soft:#1B2B4D;
  --good:#5FD08F; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1916; --s1:#7FA2FF; --s2:#FB923C; --s3:#4FD1B5; --s4:#E58BF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1521; --grid:#16212F; --surface:#151F2E; --ink:#E7EDF6; --muted:#9AA8BA; --line:#27364A;
  --accent:#7FA2FF; --accent-ink:#0D1521; --accent-soft:#1B2B4D;
  --good:#5FD08F; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1916; --s1:#7FA2FF; --s2:#FB923C; --s3:#4FD1B5; --s4:#E58BF0; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;color:var(--accent)}
.tabs{display:flex;gap:2px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{max-width:860px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:1.45rem;letter-spacing:-.015em}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.lead{color:var(--muted);max-width:65ch;margin:6px 0 0}
.badge{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.sel,.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 14px;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:42px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.ticket-picker{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.ticket-picker summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:650;min-height:28px}
.ticket-picker-body{padding-top:12px;display:grid;gap:12px}
.ticket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.ticket-choice{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;min-height:40px}
.ticket-choice input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}
.ticket-choice .ticket-no{display:block;color:var(--muted);font-size:.72rem;margin-bottom:2px}
.ticket-choice .ticket-name{display:block;line-height:1.25;font-weight:500}
.muted{color:var(--muted);font-size:.88rem;margin:0}

.def{padding:12px 0;border-top:1px solid var(--line)}
.def:first-child{border-top:0;padding-top:0}
.def-t{font-weight:600}
.def-d{color:var(--ink);max-width:70ch}
.fm{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.fm:first-child{border-top:0;padding-top:0}
.fm-n{font-size:.85rem;color:var(--muted);font-weight:500}
.fm-d{font-size:.9rem;color:var(--muted);max-width:70ch}
.fm-f{min-width:0;overflow-x:auto;overflow-y:hidden}
.src-topic{font-size:.75rem;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;margin-left:6px}
mjx-container[jax="SVG"][display="true"]{text-align:left!important;margin:.35em 0!important;overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container[jax="SVG"]{font-size:1.06em}

.card{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.c-q{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.c-big{font-size:1.55rem;font-weight:700;line-height:1.25;text-wrap:balance}
.c-back{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.c-back mjx-container{font-size:1.3em!important}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.count{font-family:var(--mono);font-size:.85rem;color:var(--muted)}

.prob{display:flex;flex-direction:column;gap:12px}
.prob.ok{border-color:var(--good)}
.p-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.p-q{margin:0;max-width:70ch}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans .inp{width:170px;max-width:100%;font-family:var(--mono)}
.unit{color:var(--muted)}
.fb{margin:0;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.hint{display:block;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);font-weight:500;white-space:normal;overflow-wrap:anywhere}.fb.hint strong{color:var(--ink)}
.sol{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}.sol .steps{color:var(--ink)}.sol .final{color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.steps li{max-width:68ch}
.final{font-weight:600}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td mjx-container{font-size:1em!important}

.prog{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog:first-of-type{border-top:0}
.prog .nm{font-weight:500;min-width:0}
.prog .meter{height:8px}
.prog .count{display:block;margin-bottom:3px}
.empty{color:var(--muted);padding:12px 0}
.big-n{font-family:var(--mono);font-size:1.7rem;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:560px){.prog{grid-template-columns:1fr 1fr}.prog .nm{grid-column:1/-1}.c-big{font-size:1.35rem}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}

.brand-row{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.subj{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.subj button{border:0;background:none;padding:0 14px;min-height:38px;font-weight:500}
.subj button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}.s4{stroke:var(--s4)}
.s1f{fill:var(--s1)}.s2f{fill:var(--s2)}.s3f{fill:var(--s3)}.s4f{fill:var(--s4)}
.gr{display:flex;flex-direction:column;gap:10px;min-width:0;padding:16px 0;border-top:1px solid var(--line)}
.gr:first-of-type{border-top:0;padding-top:0}
.gr-t{font-weight:600}
.gr-params{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px}
.par{display:flex;flex-direction:column;gap:2px;font-size:.9rem;min-width:0}
.par label{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.par output{font-family:var(--mono);color:var(--ink);white-space:nowrap}
.par input[type=range]{width:100%;accent-color:var(--accent);min-height:30px}
.gr-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem}
.gr-leg span{display:inline-flex;align-items:center;gap:6px}
.gr-box{min-width:0}
.gr-svg{display:block;max-width:100%;touch-action:pan-y;cursor:crosshair}
.gr-svg text{font-family:var(--font);fill:var(--muted);font-size:12px}
.gr-ro{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-height:1.5em}
.gr-cap{font-size:.92rem;color:var(--muted);max-width:70ch}
.gr-dyn{color:var(--ink)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soon{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ex{padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex summary{cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ex .uses{font-size:.82rem;color:var(--muted)}
.ex[open] summary{margin-bottom:8px}
.ex .steps{margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.exam-config{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.exam-task{display:flex;flex-direction:column;gap:14px}
.exam-progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.exam-progress i{display:block;height:100%;background:var(--accent)}
.exam-clock{font-family:var(--mono);font-weight:700;font-size:1.1rem}.exam-clock.warn{color:#b42318}
.exam-options{display:flex;flex-direction:column;gap:8px}.exam-options label{display:flex;align-items:center;gap:8px}
.exam-result{border-top:1px solid var(--line);padding:14px 0}.exam-result:first-of-type{border-top:0}
.exam-result .status{font-weight:700}.exam-result .status.ok{color:#18794e}.exam-result .status.no{color:#b42318}
@media(max-width:560px){.exam-config{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand-row"><div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 27 Q16 -6 29 27"/><path d="M3 27H29" stroke-width="1.6" opacity=".5"/><circle cx="16" cy="10.5" r="2.4" fill="currentColor" stroke="none"/></svg>
    Физтренажёр
  </div><div class="subj" id="subj" role="group" aria-label="Предмет"></div></div>
  <nav class="tabs" role="tablist" aria-label="Разделы" id="tabs"></nav>
</div></header>
<main id="app"></main>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},startup:{typeset:false}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<script>
const r = String.raw;
const TOPICS = [];
const T = (o) => TOPICS.push(o);

/* ================= GEN-HELPERS: генераторы задач =================
   RI(a,b) — случайное целое; PICK(arr) — случайный элемент; sig(x,n) — округление до n значащих цифр;
   nt(x) — число для обычного текста (запятая, минус «−»); nm(x) — число внутри $...$ (запятая {,});
   sgm(n) — «+5»/«-5» для формул; sgt(n) — « + 5»/« − 5» для текста.
   НЕЛЬЗЯ называть переменные внутри генераторов именем r — это String.raw. */
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PICK=a=>a[Math.floor(Math.random()*a.length)];
const sig=(x,n=3)=>{if(!x)return 0;const p=Math.pow(10,n-Math.floor(Math.log10(Math.abs(x)))-1);return Math.round(x*p)/p};
const nt=x=>String(x).replace('.',',').replace('-','−');
const nm=x=>String(x).replace('.','{,}');
const sgm=n=>(n<0?'-':'+')+Math.abs(n);
const sgt=n=>(n<0?' − ':' + ')+Math.abs(n);

T({
  id: 'kin', ticket: 1, title: 'Кинематика материальной точки',
  intro: 'Кинематика описывает движение точки, не выясняя его причин. Движение задаётся кинематическим уравнением, скорость и ускорение получаются из него дифференцированием. Определения и обозначения даны в терминах задачника Чертова и Воробьёва (§1).',
  defs: [
    {t: 'Материальная точка', d: 'Тело, размерами и формой которого в условиях данной задачи можно пренебречь. Любое тело можно мысленно разбить на совокупность материальных точек.'},
    {t: 'Система координат', d: 'Начало отсчёта и выбранные оси координат, относительно которых задают координаты точки. Вместе с телом отсчёта и часами система координат используется для задания системы отсчёта; положение точки задаётся координатами $x, y, z$ или радиус-вектором $\\vec r$.'},
    {t: 'Кинематическое уравнение движения', d: 'Зависимость координат точки от времени: $x=f_1(t),\\ y=f_2(t),\\ z=f_3(t)$, или в векторной форме $\\vec r=\\vec r(t)$. По нему находят скорость и ускорение.'},
    {t: 'Траектория', d: 'Линия, которую описывает точка при движении. Уравнение траектории получается, если исключить время из кинематических уравнений движения.'},
    {t: 'Перемещение', d: 'Вектор $\\Delta\\vec r=\\vec r_2-\\vec r_1$, проведённый из начального положения точки в конечное. Не равен пройденному пути.'},
    {t: 'Путь', d: 'Длина участка траектории $\\Delta s$, пройденного точкой за данное время. В отличие от перемещения и разности координат $\\Delta x$, путь скалярен, не бывает отрицательным и не может убывать.'},
    {t: 'Средняя скорость', d: 'Векторная величина $\\langle\\vec v\\rangle=\\dfrac{\\Delta\\vec r}{\\Delta t}$, где $\\Delta\\vec r$ — перемещение за время $\\Delta t$. Направлена так же, как перемещение.'},
    {t: 'Средняя путевая скорость', d: 'Скалярная величина $\\langle v\\rangle=\\dfrac{\\Delta s}{\\Delta t}$, где $\\Delta s$ — путь, пройденный за время $\\Delta t$. За полный оборот по окружности вектор средней скорости равен нулю, а путевая скорость нет.'},
    {t: 'Мгновенная скорость', d: 'Первая производная радиус-вектора по времени: $\\vec v=\\dfrac{d\\vec r}{dt}$. Направлена по касательной к траектории, модуль равен производной пути: $v=\\dfrac{ds}{dt}$.'},
    {t: 'Ускорение', d: 'Первая производная скорости (вторая производная радиус-вектора) по времени: $\\vec a=\\dfrac{d\\vec v}{dt}$. Раскладывается на тангенциальную и нормальную составляющие: $\\vec a=\\vec a_\\tau+\\vec a_n$.'},
    {t: 'Нормальное ускорение', d: 'Составляющая ускорения, направленная по нормали к траектории к центру кривизны: $a_n=\\dfrac{v^2}{R}$. Меняет направление скорости.'},
    {t: 'Тангенциальное ускорение', d: 'Составляющая ускорения, направленная по касательной к траектории: $a_\\tau=\\dfrac{dv}{dt}$. Меняет модуль скорости.'},
    {t: 'Радиус кривизны', d: 'Радиус $R$ окружности, которая в данной точке наилучшим образом приближает траекторию; её центр называют центром кривизны. Для прямой $R\\to\\infty$.'},
    {t: 'Импульс', d: 'Векторная величина $\\vec p=m\\vec v$ — произведение массы материальной точки на её скорость. Направлен так же, как скорость.'}
  ],
  formulas: [
    {n: 'Скорость', f: r`\vec v=\frac{d\vec r}{dt}`, d: 'Производная радиус-вектора. Единицы: м/с.'},
    {n: 'Средняя путевая скорость', f: r`\langle v\rangle=\frac{s}{\Delta t}`, d: 's — весь пройденный путь, а не перемещение.'},
    {n: 'Ускорение', f: r`\vec a=\frac{d\vec v}{dt}=\frac{d^2\vec r}{dt^2}`, d: 'Единицы: м/с².'},
    {n: 'Равноускоренное: скорость', f: r`v=v_0+at`, d: 'При постоянном $a$.'},
    {n: 'Равноускоренное: координата', f: r`x=x_0+v_0t+\frac{at^2}{2}`, d: 'Путь при $x_0=0$ и без разворота: $s=v_0t+at^2/2$.'},
    {n: 'Без времени', f: r`v^2-v_0^2=2as`, d: 'Удобно, когда время не дано.'},
    {n: 'Нормальное ускорение', f: r`a_n=\frac{v^2}{R}`, d: 'R — радиус кривизны траектории.'},
    {n: 'Тангенциальное ускорение', f: r`a_\tau=\frac{dv}{dt}`, d: 'Производная модуля скорости.'},
    {n: 'Полное ускорение', f: r`a=\sqrt{a_n^2+a_\tau^2}`, d: 'Составляющие перпендикулярны.'},
    {n: 'Импульс', f: r`\vec p=m\vec v`, d: 'Единицы: кг·м/с.'},
    {n: 'Средняя скорость (вектор)', f: r`\langle\vec v\rangle=\frac{\Delta\vec r}{\Delta t}`, d: 'Направлена так же, как перемещение. Не путать со средней путевой скоростью.'},
    {n: 'Скорость через путь', f: r`v=\frac{ds}{dt}`, d: 'Модуль мгновенной скорости равен производной пути по времени.'},
    {n: 'Полное ускорение (вектор)', f: r`\vec a=\vec a_\tau+\vec a_n`, d: 'Тангенциальная составляющая вдоль скорости, нормальная перпендикулярно ей.'}
  ],
  examples: [
    {t: 'Закон движения → скорость, ускорение, импульс', uses: r`Формулы: $v=dx/dt$, $a=dv/dt$, $p=mv$`, q: r`Координата точки массой 0,5 кг меняется по закону $x=1+4t-3t^2+t^3$ (м, с). Найдите скорость, ускорение и импульс в момент $t=2$ с.`, steps: [r`$v=\dfrac{dx}{dt}=4-6t+3t^2$, $a=\dfrac{dv}{dt}=-6+6t$.`, r`$v(2)=4-12+12=4$ м/с, $a(2)=-6+12=6$ м/с².`, r`$p=mv=0{,}5\cdot4=2$ кг·м/с.`], a: r`4 м/с; 6 м/с²; 2 кг·м/с`},
    {t: 'Равноускоренное движение', uses: r`Формулы: $v=v_0+at$, $s=v_0t+at^2/2$, $v^2-v_0^2=2as$`, q: r`Поезд с начальной скоростью 10 м/с разгоняется с ускорением 0,5 м/с² в течение 20 с. Найдите конечную скорость и пройденный путь, проверьте путь без времени.`, steps: [r`$v=v_0+at=10+0{,}5\cdot20=20$ м/с.`, r`$s=v_0t+\dfrac{at^2}{2}=10\cdot20+\dfrac{0{,}5\cdot400}{2}=300$ м.`, r`Проверка: $s=\dfrac{v^2-v_0^2}{2a}=\dfrac{400-100}{1}=300$ м.`], a: r`20 м/с; 300 м`},
    {t: 'Перемещение и путь: две средние скорости', uses: r`Формулы: $\langle v\rangle=s/\Delta t$, $\langle\vec v\rangle=\Delta\vec r/\Delta t$`, q: r`Точка делает один полный оборот по окружности радиусом 10 м за 20 с. Найдите среднюю путевую скорость и модуль средней скорости.`, steps: [r`Путь за оборот $s=2\pi R=20\pi$ м, значит $\langle v\rangle=\dfrac{20\pi}{20}=\pi\approx3{,}14$ м/с.`, r`Точка вернулась в начало, перемещение $\Delta\vec r=0$, поэтому $|\langle\vec v\rangle|=0$.`], a: r`3,14 м/с; 0`},
    {t: 'Составляющие ускорения на окружности', uses: r`Формулы: $a_n=v^2/R$, $a_\tau=dv/dt$, $a=\sqrt{a_n^2+a_\tau^2}$`, q: r`Точка движется по дуге радиуса 50 м. В некоторый момент её скорость 10 м/с, а модуль скорости растёт со скоростью 1,5 м/с². Найдите полное ускорение.`, steps: [r`$a_n=\dfrac{v^2}{R}=\dfrac{100}{50}=2$ м/с².`, r`$a_\tau=\dfrac{dv}{dt}=1{,}5$ м/с².`, r`$a=\sqrt{a_n^2+a_\tau^2}=\sqrt{4+2{,}25}=2{,}5$ м/с².`], a: r`2,5 м/с²`},
    {t: 'Радиус кривизны траектории', uses: r`Формулы: $a_n=v^2/R$ и $a_n=g$ в верхней точке`, q: r`Камень брошен со скоростью 20 м/с под углом 60° к горизонту. Найдите радиус кривизны траектории в верхней точке ($g=9{,}8$ м/с²).`, steps: [r`В верхней точке скорость горизонтальна: $v=v_0\cos60^\circ=10$ м/с.`, r`Ускорение $g$ вертикально, то есть целиком нормальное: $a_n=g=\dfrac{v^2}{R}$.`, r`$R=\dfrac{v^2}{g}=\dfrac{100}{9{,}8}\approx10{,}2$ м.`], a: r`≈ 10,2 м`}
  ],
  problems: [
    {q: 'Тело стартует из покоя с ускорением 2 м/с². Какой путь оно пройдёт за 5 с?', a: 25, u: 'м', steps: [r`Начальная скорость нулевая, поэтому $s=\dfrac{at^2}{2}$.`, r`$s=\dfrac{2\cdot 5^2}{2}=25$ м.`]},
    {q: 'Автомобиль тормозит с начальной скоростью 10 м/с и ускорением −2 м/с². Каков тормозной путь до остановки?', a: 25, u: 'м', steps: [r`Конечная скорость $v=0$. Из $v^2-v_0^2=2as$ получаем $s=\dfrac{-v_0^2}{2a}$.`, r`$s=\dfrac{-100}{2\cdot(-2)}=25$ м.`]},
    {q: 'Координата точки меняется по закону x = 3 + 2t + 4t² (м, с). Найдите скорость в момент t = 2 с.', a: 18, u: 'м/с', steps: [r`Скорость — производная координаты: $v=\dfrac{dx}{dt}=2+8t$.`, r`$v(2)=2+8\cdot2=18$ м/с.`]},
    {q: 'Точка движется по дуге радиуса 50 м со скоростью 10 м/с. Чему равно нормальное ускорение?', a: 2, u: 'м/с²', steps: [r`$a_n=\dfrac{v^2}{R}$.`, r`$a_n=\dfrac{10^2}{50}=2$ м/с².`]},
    {id: 'g1', q: 'Скорость по закону движения x(t)', gen: () => {
      const A=RI(1,9),B=RI(2,9),C=PICK([-3,-2,-1,1,2,3,4]),t=RI(2,6),a=B+2*C*t;
      return {q: `Координата точки меняется по закону x = ${A} + ${B}t${C<0?' − ':' + '}${Math.abs(C)===1?'':Math.abs(C)}t² (м, с). Найдите скорость точки в момент t = ${t} с.`, a, u: 'м/с', steps: [
        r`Скорость — производная координаты: $v=\dfrac{dx}{dt}=${B}${sgm(2*C)}t$.`,
        r`$v(${t})=${B}${sgm(2*C)}\cdot ${t}=${a}$ м/с.`]};}},
    {id: 'g2', q: 'Скорость в момент, когда ускорение равно нулю', gen: () => {
      const D=RI(1,2),t0=RI(1,3),c=3*D*t0,B=3*D*t0*t0+RI(1,20),A=RI(1,9),v=B-3*D*t0*t0;
      return {q: `Движение точки задано уравнением x = ${A} + ${B}t − ${c}t² + ${D===1?'':D}t³ (м, с). Найдите скорость точки в тот момент, когда её ускорение равно нулю.`, a: v, u: 'м/с', steps: [
        r`Скорость и ускорение — первая и вторая производные: $v=\dfrac{dx}{dt}=${B}-${2*c}t+${3*D}t^2$, $a=\dfrac{dv}{dt}=-${2*c}+${6*D}t$.`,
        r`$a=0$ при $t=\dfrac{${2*c}}{${6*D}}=${t0}$ с.`,
        r`$v(${t0})=${B}-${2*c}\cdot ${t0}+${3*D}\cdot ${t0}^2=${v}$ м/с.`]};}},
    {id: 'g3', q: 'Средняя путевая скорость: две половины пути', gen: () => {
      const [v1,v2]=PICK([[30,60],[40,60],[20,30],[60,90],[30,45],[50,75],[40,120],[20,60]]),a=2*v1*v2/(v1+v2);
      return {q: `Автомобиль первую половину пути проехал со скоростью ${v1} км/ч, вторую половину — со скоростью ${v2} км/ч. Найдите среднюю путевую скорость на всём пути.`, a, u: 'км/ч', steps: [
        r`Пусть весь путь равен $s$. Время на первой половине $t_1=\dfrac{s}{2v_1}$, на второй $t_2=\dfrac{s}{2v_2}$.`,
        r`$\langle v\rangle=\dfrac{s}{t_1+t_2}=\dfrac{2v_1v_2}{v_1+v_2}$. Это не среднее арифметическое скоростей.`,
        r`$\langle v\rangle=\dfrac{2\cdot ${v1}\cdot ${v2}}{${v1}+${v2}}=${a}$ км/ч.`]};}},
    {id: 'g4', q: 'Модуль средней скорости (перемещение) на половине окружности', gen: () => {
      const R=RI(2,15),t=RI(2,10),a=sig(2*R/t,3),sp=sig(Math.PI*R/t,3);
      return {q: `Точка движется по окружности радиусом ${R} м и за ${t} с проходит половину окружности. Найдите модуль вектора средней скорости за это время.`, a, u: 'м/с', steps: [
        r`Модуль средней скорости определяется перемещением: $|\langle\vec v\rangle|=\dfrac{|\Delta\vec r|}{\Delta t}$.`,
        r`За половину окружности точка попадает в диаметрально противоположную точку, поэтому $|\Delta\vec r|=2R=${2*R}$ м.`,
        r`$|\langle\vec v\rangle|=\dfrac{${2*R}}{${t}}\approx ${nm(a)}$ м/с. Для сравнения, средняя путевая скорость $\dfrac{\pi R}{t}\approx ${nm(sp)}$ м/с больше.`]};}},
    {id: 'g5', q: 'Тормозной путь без времени', gen: () => {
      const kmh=PICK([36,54,72,90,108]),v0=sig(kmh/3.6,4),aa=PICK([2,2.5,4,5]),a=sig(v0*v0/(2*aa),4);
      return {q: `Автомобиль двигался со скоростью ${kmh} км/ч и затормозил с постоянным ускорением ${nt(aa)} м/с² (по модулю). Найдите тормозной путь до остановки.`, a, u: 'м', steps: [
        r`Переводим скорость: $v_0=\dfrac{${kmh}}{3{,}6}=${v0}$ м/с.`,
        r`Время неизвестно, поэтому берём $v^2-v_0^2=2as$ при $v=0$ и ускорении $-${nm(aa)}$ м/с²: $s=\dfrac{v_0^2}{2|a|}$.`,
        r`$s=\dfrac{${v0}^2}{2\cdot ${nm(aa)}}\approx ${nm(a)}$ м.`]};}},
    {id: 'g6', q: 'Путь при равноускоренном движении', gen: () => {
      const v0=RI(2,10),aa=PICK([1,1.5,2,2.5,3,4]),t=RI(3,10),a=sig(v0*t+aa*t*t/2,4),v=sig(v0+aa*t,4);
      return {q: `Тело движется прямолинейно с начальной скоростью ${v0} м/с и постоянным ускорением ${nt(aa)} м/с². Какой путь оно пройдёт за ${t} с?`, a, u: 'м', steps: [
        r`Движение равноускоренное без разворота, поэтому путь $s=v_0t+\dfrac{at^2}{2}$.`,
        r`$s=${v0}\cdot ${t}+\dfrac{${nm(aa)}\cdot ${t}^2}{2}=${nm(a)}$ м.`,
        r`Проверка: $v=v_0+at=${nm(v)}$ м/с, и $\dfrac{v^2-v_0^2}{2a}$ даёт тот же путь.`]};}},
    {id: 'g7', q: 'Радиус кривизны в верхней точке траектории', gen: () => {
      const v0=PICK([10,15,20,25,30]),al=PICK([30,45,60]),c2={30:0.75,45:0.5,60:0.25}[al],a=sig(v0*v0*c2/9.8,3);
      return {q: `Камень брошен со скоростью ${v0} м/с под углом ${al}° к горизонту. Найдите радиус кривизны траектории в верхней точке (g = 9,8 м/с²).`, a, u: 'м', steps: [
        r`В верхней точке скорость горизонтальна: $v=v_0\cos\alpha=${v0}\cdot\cos ${al}^\circ$, а ускорение $g$ направлено вертикально, то есть перпендикулярно скорости.`,
        r`Значит, всё ускорение нормальное: $a_n=g=\dfrac{v^2}{R}$, откуда $R=\dfrac{v_0^2\cos^2\alpha}{g}$.`,
        r`$R=\dfrac{${v0}^2\cdot ${nm(c2)}}{9{,}8}\approx ${nm(a)}$ м.`]};}},
    {id: 'g8', q: 'Импульс падающего шарика', gen: () => {
      const m=PICK([0.1,0.2,0.5,1,2]),h=PICK([5,10,20,45,80]),v=sig(Math.sqrt(2*9.8*h),4),a=sig(m*Math.sqrt(2*9.8*h),3);
      return {q: `Шарик массой ${nt(m)} кг падает без начальной скорости с высоты ${h} м. Найдите его импульс перед ударом о землю (g = 9,8 м/с², сопротивлением воздуха пренебречь).`, a, u: 'кг·м/с', steps: [
        r`Начальная скорость нулевая, ускорение $g$, путь $h$: $v^2=2gh$, $v=\sqrt{2gh}=\sqrt{2\cdot 9{,}8\cdot ${h}}\approx ${nm(v)}$ м/с.`,
        r`Импульс $p=mv=${nm(m)}\cdot ${nm(v)}\approx ${nm(a)}$ кг·м/с.`]};}},
    {id: 'g9', q: 'Полное ускорение при движении по окружности', gen: () => {
      const A=PICK([1,2,3]),R=PICK([20,25,50,100]),t=RI(3,8),an=sig(A*A*t*t/R,4),a=sig(Math.sqrt(A*A+an*an),3);
      return {q: `Точка движется по окружности радиусом ${R} м, модуль её скорости растёт по закону v = ${A}t (м/с, t в секундах). Найдите полное ускорение точки в момент t = ${t} с.`, a, u: 'м/с²', steps: [
        r`Тангенциальное ускорение: $a_\tau=\dfrac{dv}{dt}=${A}$ м/с².`,
        r`Скорость в момент $t$: $v=${A}\cdot ${t}=${A*t}$ м/с, нормальное ускорение $a_n=\dfrac{v^2}{R}=\dfrac{${A*t}^2}{${R}}=${nm(an)}$ м/с².`,
        r`Составляющие перпендикулярны: $a=\sqrt{a_\tau^2+a_n^2}=\sqrt{${A}^2+${nm(an)}^2}\approx ${nm(a)}$ м/с².`]};}},
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Тело движется прямолинейно: первые 6 с его начальная скорость 4 м/с и ускорение 2 м/с², затем оно тормозит с постоянным ускорением 3 м/с² до остановки. Найдите полный путь.',a:102.667,u:'м',tol:0.02,steps:[r`На первом участке $v_1=v_0+at=4+2\cdot6=16$ м/с, а $s_1=v_0t+at^2/2=4\cdot6+2\cdot6^2/2=60$ м.`,r`На втором участке тело тормозит до нуля. Из $v^2-v_1^2=2as_2$ при $v=0$ и $a=-3$ получаем $s_2=v_1^2/(2\cdot3)=256/6\approx42{,}667$ м.`,r`Полный путь $s=s_1+s_2=60+42{,}667\approx102{,}667$ м.`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Камень брошен со скоростью 20 м/с под углом 30° к горизонту. Найдите радиус кривизны траектории через 1 с после броска. Сопротивлением воздуха пренебречь, g = 9,8 м/с².',a:30.60,u:'м',tol:0.03,steps:[r`Проекции скорости: $v_x=v_0\cos30^\circ=10\sqrt3\approx17{,}32$ м/с; $v_y=v_0\sin30^\circ-gt=10-9{,}8=0{,}2$ м/с.`,r`Модуль скорости $v=\sqrt{v_x^2+v_y^2}\approx17{,}321$ м/с. Нормальная составляющая ускорения $a_n=|\vec v\times\vec g|/v=gv_x/v\approx9{,}799$ м/с².`,r`Радиус кривизны $R=v^2/a_n\approx299{,}84/9{,}799\approx30{,}60$ м.`]},
  ]
});

T({
  id: 'rot', ticket: 2, title: 'Кинематика вращения. Момент инерции',
  intro: 'Вращение описывается теми же величинами, что и поступательное движение, но с углами вместо длин: угловая скорость, угловое ускорение, момент инерции вместо массы. Обозначения даны по задачнику Чертова и Воробьёва (§1 и §3).',
  defs: [
    {t: 'Угловое перемещение', d: 'Угол поворота $\\varphi$ (в радианах). Элементарный поворот $d\\vec\\varphi$ — вектор вдоль оси вращения, направление определяется правилом правого винта.'},
    {t: 'Угловая скорость', d: 'Первая производная угла поворота по времени: $\\vec\\omega=\\dfrac{d\\vec\\varphi}{dt}$. Вектор направлен вдоль оси вращения по правилу правого винта. Единица: рад/с.'},
    {t: 'Угловое ускорение', d: 'Первая производная угловой скорости по времени: $\\vec\\varepsilon=\\dfrac{d\\vec\\omega}{dt}$. Единица: рад/с².'},
    {t: 'Период и частота вращения', d: 'Период $T$ — время одного оборота, частота $n$ — число оборотов в единицу времени: $n=\\dfrac1T$, $\\omega=2\\pi n$.'},
    {t: 'Связь угловых и линейных величин', d: 'Для точки на расстоянии $R$ от оси: линейная скорость $v=\\omega R$, тангенциальное ускорение $a_\\tau=\\varepsilon R$, нормальное ускорение $a_n=\\omega^2R$.'},
    {t: 'Момент инерции', d: 'Мера инертности тела при вращении. Для системы материальных точек $I=\\sum m_ir_i^2$, для сплошного тела $I=\\int r^2\\,dm$. Зависит от массы и от её распределения относительно оси.'},
    {t: 'Момент импульса', d: 'Для материальной точки $\\vec L=\\vec r\\times\\vec p$, $L=mvr\\sin\\alpha$; для твёрдого тела на фиксированной оси $L=I\\omega$.'},
    {t: 'Момент силы', d: 'Вращающее действие силы: $\\vec M=\\vec r\\times\\vec F$. Модуль $M=Fl$, где $l$ — плечо.'},
    {t: 'Плечо силы', d: 'Кратчайшее расстояние от оси вращения (точки) до линии действия силы: $l=r\\sin\\alpha$.'},
    {t: 'Теорема Штейнера', d: 'Момент инерции $I$ относительно произвольной оси равен моменту инерции $I_c$ относительно параллельной оси через центр масс плюс $md^2$, где $d$ — расстояние между осями.'}
  ],
  formulas: [
    {n: 'Угловая скорость', f: r`\omega=\frac{d\varphi}{dt}`, d: 'Единицы: рад/с.'},
    {n: 'Угловое ускорение', f: r`\varepsilon=\frac{d\omega}{dt}`, d: 'Единицы: рад/с².'},
    {n: 'Равноускоренное вращение', f: r`\varphi=\omega_0t+\frac{\varepsilon t^2}{2},\quad \omega=\omega_0+\varepsilon t`, d: 'Полная аналогия с $x$ и $v$.'},
    {n: 'Связь угловых и линейных величин', f: r`v=\omega R,\quad a_\tau=\varepsilon R,\quad a_n=\omega^2R`, d: 'R — расстояние от оси.'},
    {n: 'Частота и период', f: r`\omega=2\pi n=\frac{2\pi}{T}`, d: 'n — число оборотов в секунду.'},
    {n: 'Момент силы', f: r`M=Fl=Fr\sin\alpha`, d: r`l — плечо, $\alpha$ — угол между $\vec r$ и $\vec F$.`},
    {n: 'Момент инерции точки', f: r`I=mr^2`, d: 'Для системы суммируем по всем точкам.'},
    {n: 'Обруч или тонкое кольцо', f: r`I=mR^2`, d: 'Ось через центр перпендикулярно плоскости.'},
    {n: 'Диск или цилиндр', f: r`I=\frac12mR^2`, d: 'Ось симметрии.'},
    {n: 'Сплошной шар', f: r`I=\frac25mR^2`, d: 'Ось через центр.'},
    {n: 'Тонкий стержень', f: r`I_c=\frac1{12}ml^2,\quad I_{\text{конец}}=\frac13ml^2`, d: 'Ось перпендикулярна стержню, через центр или через конец.'},
    {n: 'Теорема Штейнера', f: r`I=I_c+md^2`, d: 'd — расстояние между осями.'},
    {n: 'Момент импульса', f: r`L=I\omega,\quad L=mvr\sin\alpha`, d: r`Первая формула — твёрдое тело на фиксированной оси, вторая — материальная точка ($\alpha$ — угол между $\vec r$ и $\vec p$).`},
    {n: 'Момент инерции сплошного тела', f: r`I=\int r^2\,dm`, d: 'Интегрирование по всей массе тела. Для типовых тел даны готовые формулы выше.'}
  ],
  examples: [

    {t: 'Момент инерции системы точек и типовых тел', uses: r`Формулы: $I=\sum m_ir_i^2$, $I=mR^2$, $I=\tfrac12mR^2$, $I=\tfrac25mR^2$`, q: r`а) Шарики 0,2 кг и 0,3 кг на концах невесомого стержня длиной 1 м, ось через середину. б) Кольцо, диск и шар массой 2 кг и радиусом 0,5 м, ось через центр.`, steps: [r`а) $I=m_1\left(\dfrac l2\right)^2+m_2\left(\dfrac l2\right)^2=0{,}2\cdot0{,}25+0{,}3\cdot0{,}25=0{,}125$ кг·м².`, r`б) Кольцо: $mR^2=0{,}5$ кг·м². Диск: $\dfrac12mR^2=0{,}25$ кг·м². Шар: $\dfrac25mR^2=0{,}2$ кг·м².`], a: r`а) 0,125 кг·м²; б) 0,5; 0,25; 0,2 кг·м²`},
    {t: 'Теорема Штейнера', uses: r`Формулы: $I_c=\tfrac1{12}ml^2$, $I=I_c+md^2$, $I=\tfrac12mR^2$`, q: r`а) Стержень массой 2 кг и длиной 1,5 м, ось перпендикулярна стержню и проходит в 0,5 м от центра. б) Диск массой 4 кг и радиусом 0,5 м, ось перпендикулярна плоскости и проходит через край.`, steps: [r`а) $I_c=\dfrac{ml^2}{12}=\dfrac{2\cdot2{,}25}{12}=0{,}375$ кг·м²; $I=I_c+md^2=0{,}375+2\cdot0{,}25=0{,}875$ кг·м².`, r`б) $I_c=\dfrac12mR^2=0{,}5$ кг·м²; $d=R$, поэтому $I=0{,}5+4\cdot0{,}25=1{,}5$ кг·м² ($=\tfrac32mR^2$).`], a: r`а) 0,875 кг·м²; б) 1,5 кг·м²`}
    ,{t: 'Момент импульса точки и твёрдого тела', uses: r`Формулы: $L=mvr\sin\alpha$, $L=I\omega$`, q: r`а) Частица массой 0,2 кг движется со скоростью 5 м/с на расстоянии 0,4 м от точки отсчёта; угол между радиус-вектором и скоростью равен 30°. Найдите модуль момента импульса. б) Диск имеет момент инерции 0,25 кг·м² и вращается с угловой скоростью 8 рад/с. Найдите момент импульса относительно оси.`, steps: [r`Для частицы $L=mvr\sin\alpha=0{,}2\cdot5\cdot0{,}4\cdot\sin30^\circ=0{,}2$ кг·м²/с.`, r`Для диска на фиксированной оси $L=I\omega=0{,}25\cdot8=2$ кг·м²/с.`], a: r`а) 0,2 кг·м²/с; б) 2 кг·м²/с`},
    {t: 'Момент инерции однородного стержня через интеграл', uses: r`Формулы: $I=\int r^2\,dm$, $dm=(m/l)\,dx$, $I_{\text{конец}}=ml^2/3$`, q: r`Однородный тонкий стержень массой 3 кг и длиной 2 м вращается вокруг оси, перпендикулярной стержню и проходящей через его конец. Получите момент инерции интегрированием.`, steps: [r`Выберем координату $x$ вдоль стержня от оси. Линейная плотность $\lambda=m/l$, поэтому $dm=\lambda dx=(m/l)dx$.`, r`$I=\int_0^l x^2\,dm=\dfrac{m}{l}\int_0^l x^2dx=\dfrac{m}{l}\cdot\dfrac{l^3}{3}=\dfrac{ml^2}{3}$.`, r`Подстановка: $I=\dfrac{3\cdot2^2}{3}=4$ кг·м². Это совпадает с формулой для оси через конец стержня.`], a: r`4 кг·м²`}

    {t:'Работа постоянной силы и мощность',uses:r`$A=Fs\cos\alpha$, $N=Fv\cos\alpha$`,q:r`Сила 40 Н тянет тело под углом 60° к перемещению 5 м за 4 с. Найдите работу и среднюю мощность.`,steps:[r`$A=Fs\cos\alpha=40\cdot5\cdot0{,}5=100$ Дж.`,r`Средняя мощность $N=A/t=100/4=25$ Вт.`],a:r`100 Дж; 25 Вт`},
    {t:'Работа переменной силы',uses:r`$A=\int_1^2 F_x\,dx$`,q:r`Сила вдоль оси меняется по закону $F_x=3x$ Н. Найдите работу при перемещении от $x=0$ до $x=4$ м.`,steps:[r`$A=\int_0^4 3x\,dx=\left.\dfrac{3x^2}{2}\right|_0^4=24$ Дж.`],a:r`24 Дж`},
    {t:'Потенциальная энергия и работа поля тяжести',uses:r`$W_p=mgh$, $A_{12}=W_{p1}-W_{p2}$`,q:r`Груз массой 3 кг опустили с высоты 8 м на высоту 2 м. Найдите работу силы тяжести и изменение потенциальной энергии. $g=10$ м/с².`,steps:[r`$A=mg(h_1-h_2)=3\cdot10\cdot(8-2)=180$ Дж.`,r`$\Delta W_p=mg(h_2-h_1)=-180$ Дж, поэтому $A=-\Delta W_p$.`],a:r`180 Дж; −180 Дж`},
    {t:'Сила через потенциальную энергию',uses:r`$F_x=-dW_p/dx$, $W_p=kx^2/2$`,q:r`Потенциальная энергия тела задана функцией $W_p=2x^2$ Дж. Найдите силу при $x=3$ м.`,steps:[r`$F_x=-\dfrac{dW_p}{dx}=-4x$.`,r`При $x=3$ м: $F_x=-12$ Н.`],a:r`−12 Н`},
    {t:'Гравитационная потенциальная энергия',uses:r`$W_p=-GMm/r$`,q:r`Два тела имеют массы $M=6\cdot10^{10}$ кг и $m=2$ кг, расстояние между ними $r=2$ м. Найдите потенциальную энергию взаимодействия, используя $G=6{,}67\cdot10^{-11}$.`,steps:[r`$W_p=-G\dfrac{Mm}{r}=-\dfrac{6{,}67\cdot10^{-11}\cdot6\cdot10^{10}\cdot2}{2}$.`,r`$W_p=-4{,}002$ Дж.`],a:r`−4,002 Дж`}
  ],
  problems: [
    {q: 'Сила 20 Н направлена под углом 60° к перемещению 10 м. Найдите работу.', a: 100, u: 'Дж', steps: [r`$A=Fs\cos\alpha$.`, r`$A=20\cdot10\cdot0{,}5=100$ Дж.`]},
    {q: 'Подъёмник поднимает груз 50 кг на высоту 10 м за 20 с. Какова средняя мощность? Принять g = 10 м/с².', a: 250, u: 'Вт', steps: [r`Работа $A=mgh=50\cdot10\cdot10=5000$ Дж.`, r`$N=\dfrac{A}{t}=\dfrac{5000}{20}=250$ Вт.`]},
    {q: 'Пружина жёсткостью 200 Н/м растянута на 0,1 м. Чему равна потенциальная энергия?', a: 1, u: 'Дж', steps: [r`$W_p=\dfrac{kx^2}{2}$.`, r`$W_p=\dfrac{200\cdot0{,}01}{2}=1$ Дж.`]},
    {q: 'Тело массой 2 кг падает с высоты 5 м до высоты 2 м. Какую работу совершает сила тяжести? g = 10 м/с².', a: 60, u: 'Дж', steps: [r`Работа равна убыли потенциальной энергии: $A=mg(h_1-h_2)$.`, r`$A=2\cdot10\cdot3=60$ Дж.`]},

    {id:'g1',q:'Работа постоянной силы',gen:()=>{const F=RI(10,80),ss=RI(2,12),ang=PICK([0,30,60,90]),a=sig(F*ss*Math.cos(ang*Math.PI/180),4);return {q:`Сила ${F} Н перемещает тело на ${ss} м под углом ${ang}° к перемещению. Найдите работу.`,a,u:'Дж',steps:[r`$A=Fs\cos\alpha$.`,r`$A=${F}\cdot${ss}\cdot\cos ${ang}^\circ\approx ${nm(a)}$ Дж.`]};}},
    {id:'g2',q:'Мощность при равномерном движении',gen:()=>{const F=RI(20,100),v=RI(1,12),ang=PICK([0,30,60]),a=sig(F*v*Math.cos(ang*Math.PI/180),4);return {q:`Сила ${F} Н направлена под углом ${ang}° к скорости ${v} м/с. Найдите мгновенную мощность.`,a,u:'Вт',steps:[r`$N=Fv\cos\alpha$.`,r`$N=${F}\cdot${v}\cdot\cos ${ang}^\circ\approx ${nm(a)}$ Вт.`]};}},
    {id:'g3',q:'Изменение потенциальной энергии тяжести',gen:()=>{const m=RI(1,15),h1=RI(3,20),h2=RI(0,h1-1),a=m*9.8*(h1-h2);return {q:`Тело массой ${m} кг опустили с высоты ${h1} м на высоту ${h2} м. Найдите работу силы тяжести (g = 9,8 м/с²).`,a,u:'Дж',steps:[r`$A=mg(h_1-h_2)$.`,r`$A=${m}\cdot9{,}8\cdot(${h1}-${h2})=${a}$ Дж.`]};}},
    {id:'g4',q:'Энергия упругой деформации',gen:()=>{const k=RI(50,500),x=RI(1,20)/100,a=sig(k*x*x/2,4);return {q:`Пружина жёсткостью ${k} Н/м растянута на ${nt(x)} м. Найдите её потенциальную энергию.`,a,u:'Дж',steps:[r`$W_p=\dfrac{kx^2}{2}$.`,r`$W_p=\dfrac{${k}\cdot${nm(x)}^2}{2}\approx ${nm(a)}$ Дж.`]};}},
    {id:'g5',q:'Сила через потенциальную энергию',gen:()=>{const c=RI(1,8),x=RI(1,10),a=-2*c*x;return {q:`Потенциальная энергия в одном измерении $W_p=${c}x^2$ Дж. Найдите силу при x = ${x} м.`,a,u:'Н',steps:[r`$F_x=-\dfrac{dW_p}{dx}=-2${c}x$.`,r`$F_x=-2\cdot${c}\cdot${x}=${a}$ Н.`]};}},
    {id:'g6',q:'Работа переменной силы',gen:()=>{const c=RI(1,8),L=RI(2,10),a=c*L*L/2;return {q:`Сила зависит от координаты как $F_x=${c}x$ Н. Найдите работу от x = 0 до x = ${L} м.`,a,u:'Дж',steps:[r`$A=\int_0^L cx\,dx=\dfrac{cL^2}{2}$.`,r`$A=\dfrac{${c}\cdot${L}^2}{2}=${a}$ Дж.`]};}},
    {id:'g7',q:'Гравитационная потенциальная энергия',gen:()=>{const M=RI(1,9)*1e10,m=RI(1,5),rr=RI(2,10),a=sig(-6.67e-11*M*m/rr,4);return {q:`Массы тел ${M.toExponential(0)} кг и ${m} кг разделены расстоянием ${rr} м. Найдите потенциальную энергию взаимодействия (G = 6,67·10⁻¹¹ Н·м²/кг²).`,a,u:'Дж',steps:[r`$W_p=-G\dfrac{Mm}{r}$.`,r`$W_p=-6{,}67\cdot10^{-11}\dfrac{${M.toExponential(0)}\cdot${m}}{${rr}}\approx ${nm(a)}$ Дж.`]};}},
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Сила вдоль оси x зависит от координаты как F(x) = 6x − 2 Н. Найдите работу силы при перемещении от x = 1 м до x = 4 м.',a:39,u:'Дж',steps:[r`Работа переменной силы $A=\int_{1}^{4}F(x)\,dx=\int_1^4(6x-2)\,dx$.`,r`Первообразная: $3x^2-2x$. Поэтому $A=(3\cdot4^2-2\cdot4)-(3\cdot1^2-2\cdot1)$.`,r`$A=(48-8)-(3-2)=40-1=39$ Дж.`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Потенциальная энергия частицы в одномерном поле задана функцией Wₚ(x) = x³ − 6x² + 9x Дж (x в метрах). Найдите работу силы поля при перемещении частицы из x = 1 м в x = 3 м; выведите выражение для силы и проверьте результат интегрированием.',a:4,u:'Дж',steps:[r`Сила через потенциальную энергию: $F_x=-dW_p/dx=-(3x^2-12x+9)=-3x^2+12x-9$ Н.`,r`Работа потенциальной силы равна убыли потенциальной энергии: $A=W_p(1)-W_p(3)$. Здесь $W_p(1)=1-6+9=4$ Дж, а $W_p(3)=27-54+27=0$ Дж.`,r`Проверка: $A=\int_1^3(-3x^2+12x-9)dx=[-x^3+6x^2-9x]_1^3=0-(-4)=4$ Дж.`]},
  ]
});

T({
  id: 'newton', ticket: 4, title: 'Законы Ньютона. Инерциальные системы',
  intro: 'Законы Ньютона верны в инерциальных системах отсчёта. В неинерциальных добавляются силы инерции.',
  defs: [
    {t: 'Инерциальная система отсчёта (ИСО)', d: 'Система, в которой свободное тело движется равномерно и прямолинейно. Любая система, движущаяся относительно ИСО равномерно и прямолинейно, тоже инерциальна.'},
    {t: 'Первый закон Ньютона', d: 'Существуют ИСО, в которых тело сохраняет состояние покоя или равномерного прямолинейного движения, пока на него не действуют другие тела.'},
    {t: 'Второй закон Ньютона', d: 'Ускорение тела пропорционально равнодействующей силе и обратно пропорционально массе. В общем виде: скорость изменения импульса равна силе.'},
    {t: 'Третий закон Ньютона', d: 'Силы взаимодействия двух тел равны по модулю, противоположны по направлению, приложены к разным телам и имеют одну природу.'},
    {t: 'Принцип относительности Галилея', d: 'Во всех ИСО механические явления протекают одинаково. Уравнения механики не меняются при преобразованиях Галилея.'},
    {t: 'Ограниченность законов Ньютона', d: 'Не работают при скоростях, близких к скорости света (нужна СТО), в микромире (нужна квантовая механика), в неинерциальных системах без сил инерции.'},
    {t: 'Сила инерции', d: 'Фиктивная сила, вводимая в неинерциальной СО, чтобы пользоваться вторым законом. Равна $-m\\vec a_0$ при поступательном ускорении системы.'},
    {t: 'Центробежная сила инерции', d: 'Сила инерции во вращающейся системе, направлена от оси: $F=m\\omega^2R$.'}
  ],
  formulas: [
    {n: 'Второй закон', f: r`m\vec a=\vec F=\sum\vec F_i`, d: 'Для постоянной массы.'},
    {n: 'Второй закон в импульсной форме', f: r`\vec F=\frac{d\vec p}{dt}`, d: 'Верен и при переменной массе.'},
    {n: 'Третий закон', f: r`\vec F_{12}=-\vec F_{21}`, d: ''},
    {n: 'Преобразования Галилея', f: r`x'=x-Vt,\quad y'=y,\ z'=z,\ t'=t`, d: 'Система $K\'$ движется со скоростью $V$ вдоль $x$.'},
    {n: 'Сложение скоростей', f: r`\vec v=\vec v'+\vec V`, d: 'Классический закон.'},
    {n: 'Ускорение при Галилее', f: r`\vec a=\vec a'`, d: 'Ускорение одинаково во всех ИСО.'},
    {n: 'Сила инерции', f: r`\vec F_{ин}=-m\vec a_0`, d: '$a_0$ — ускорение неинерциальной системы.'},
    {n: 'Сила трения скольжения', f: r`F_{тр}=\mu N`, d: 'N — сила реакции опоры.'},
    {n: 'Сила упругости (закон Гука)', f: r`F=-kx`, d: ''},
    {n: 'Вес тела в лифте', f: r`P=m(g\pm a)`, d: 'Плюс при ускорении вверх.'}
  ],

  examples: [
    {t:'Второй закон Ньютона',uses:r`$\sum\vec F=m\vec a$, $\vec F=d\vec p/dt$`,q:r`На тело массой 6 кг действует равнодействующая сила 18 Н. Найдите ускорение.`,steps:[r`По второму закону $a=F/m$.`,r`$a=18/6=3$ м/с².`],a:r`3 м/с²`},
    {t:'Преобразования Галилея и скорость',uses:r`$x'=x-Vt$, $\vec v=\vec v'+\vec V$, $\vec a=\vec a'$`,q:r`Поезд движется относительно платформы со скоростью 12 м/с, а платформа движется относительно земли со скоростью 8 м/с в том же направлении. Найдите скорость поезда относительно земли.`,steps:[r`Для сонаправленных скоростей $v=v'+V$.`,r`$v=12+8=20$ м/с. При преобразовании Галилея время одинаково, а ускорение в обеих ИСО совпадает.`],a:r`20 м/с`},
    {t:'Сила инерции',uses:r`$\vec F_{ин}=-m\vec a_0$`,q:r`Лифт ускоряется вправо с ускорением 2 м/с². Найдите силу инерции для тела массой 5 кг в системе лифта.`,steps:[r`$\vec F_{ин}=-m\vec a_0$.`,r`$F_{ин}=-5\cdot2=-10$ Н: сила направлена влево.`],a:r`10 Н влево`},
    {t:'Трение и закон Гука',uses:r`$F_{тр}=\mu N$, $F=-kx$`,q:r`Брусок массой 4 кг скользит по горизонтали, $\mu=0{,}25$. Пружина жёсткостью 100 Н/м растянута на 0,1 м. Найдите модули силы трения и силы упругости. $g=10$ м/с².`,steps:[r`$F_{тр}=\mu N=\mu mg=0{,}25\cdot4\cdot10=10$ Н.`,r`По закону Гука $|F|=kx=100\cdot0{,}1=10$ Н.`],a:r`10 Н; 10 Н`},
    {t:'Вес в лифте',uses:r`$P=m(g\pm a)$`,q:r`Человек массой 60 кг находится в лифте, ускоряющемся вниз с ускорением 2 м/с². Найдите вес при $g=10$ м/с².`,steps:[r`При ускорении вниз $P=m(g-a)$.`,r`$P=60(10-2)=480$ Н.`],a:r`480 Н`},
    {t:'Третий закон и импульсная форма второго закона',uses:r`$\vec F_{12}=-\vec F_{21}$, $\vec F=d\vec p/dt$`,q:r`При взаимодействии два тела действуют друг на друга силами. На первое тело за 0,2 с действует средняя сила 15 Н. Найдите модуль изменения его импульса и силу, действующую на второе тело.`,steps:[r`Из импульсной формы второго закона $F=\Delta p/\Delta t$, поэтому $\Delta p=F\Delta t=15\cdot0{,}2=3$ кг·м/с.`,r`По третьему закону Ньютона силы взаимодействия равны по модулю и противоположны: модуль силы на второе тело также 15 Н.`],a:r`3 кг·м/с; 15 Н`}
  ],
  problems: [
    {q: 'Сила 20 Н действует на тело массой 4 кг. Найдите ускорение.', a: 5, u: 'м/с²', steps: [r`$a=\dfrac{F}{m}=\dfrac{20}{4}=5$ м/с².`]},
    {q: 'Человек массой 70 кг стоит в лифте, который едет вверх с ускорением 2 м/с². Каков его вес? g = 10 м/с².', a: 840, u: 'Н', steps: [r`Второй закон: $N-mg=ma$.`, r`$P=N=m(g+a)=70\cdot12=840$ Н.`]},
    {q: 'Брусок скользит по гладкой наклонной плоскости с углом 30°. Найдите ускорение. g = 10 м/с².', a: 5, u: 'м/с²', steps: [r`Вдоль плоскости действует только составляющая тяжести: $ma=mg\sin\alpha$.`, r`$a=g\sin30^\circ=10\cdot0{,}5=5$ м/с².`]},
    {q: 'Брусок 10 кг тянут по горизонтали силой 50 Н. Коэффициент трения 0,3. Найдите ускорение. g = 10 м/с².', a: 2, u: 'м/с²', steps: [r`Сила трения $F_{тр}=\mu mg=0{,}3\cdot100=30$ Н.`, r`$a=\dfrac{F-F_{тр}}{m}=\dfrac{20}{10}=2$ м/с².`]},
    {q: 'Автомобиль едет со скоростью 20 м/с, навстречу ему другой со скоростью 15 м/с. Какова скорость сближения в системе первого?', a: 35, u: 'м/с', steps: [r`Преобразование Галилея: скорости при встречном движении складываются.`, r`$v=20+15=35$ м/с.`]},

    {id:'g1',q:'Ускорение по равнодействующей',gen:()=>{const m=RI(2,20),a=RI(1,12),F=m*a;return {q:`На тело массой ${m} кг действует равнодействующая сила ${F} Н. Найдите ускорение.`,a,u:'м/с²',steps:[r`$\sum F=ma$, значит $a=F/m$.`,r`$a=${F}/${m}=${a}$ м/с².`]};}},
    {id:'g2',q:'Сила инерции',gen:()=>{const m=RI(2,15),aa=RI(1,6),a=m*aa;return {q:`Система отсчёта ускоряется вправо с ускорением ${aa} м/с². Найдите модуль силы инерции для тела массой ${m} кг.`,a,u:'Н',steps:[r`$F_{ин}=ma_0$.`,r`$F_{ин}=${m}\cdot${aa}=${a}$ Н; направлена против ускорения системы.`]};}},
    {id:'g3',q:'Вес в лифте',gen:()=>{const m=RI(40,100),aa=RI(1,4),up=PICK([true,false]),a=m*(10+(up?aa:-aa));return {q:`Человек массой ${m} кг находится в лифте, ускоряющемся ${up?'вверх':'вниз'} с ускорением ${aa} м/с². Найдите вес (g = 10 м/с²).`,a,u:'Н',steps:[r`При движении с ускорением ${up?'вверх':'вниз'}: $P=m(g${up?'+':'-'}a)$.`,r`$P=${m}(10${up?'+':'-'}${aa})=${a}$ Н.`]};}},
    {id:'g4',q:'Сила трения скольжения',gen:()=>{const m=RI(2,20),mu=PICK([0.1,0.2,0.25,0.3,0.4]),a=sig(mu*m*10,4);return {q:`Брусок массой ${m} кг скользит по горизонтали. Коэффициент трения ${nt(mu)}, g = 10 м/с². Найдите силу трения.`,a,u:'Н',steps:[r`$F_{тр}=\mu N=\mu mg$.`,r`$F_{тр}=${nm(mu)}\cdot${m}\cdot10=${nm(a)}$ Н.`]};}},
    {id:'g5',q:'Закон Гука',gen:()=>{const k=RI(50,500),x=RI(1,20)/100,a=sig(k*x,4);return {q:`Пружина жёсткостью ${k} Н/м деформирована на ${nt(x)} м. Найдите модуль силы упругости.`,a,u:'Н',steps:[r`По закону Гука $|F|=kx$.`,r`$|F|=${k}\cdot${nm(x)}=${nm(a)}$ Н.`]};}},
    {id:'g6',q:'Сложение скоростей по Галилею',gen:()=>{const vp=RI(2,30),V=RI(2,20),same=PICK([true,false]),a=same?vp+V:V-vp;return {q:`Тело движется относительно системы со скоростью ${vp} м/с ${same?'в направлении её движения':'против её движения'}. Система движется относительно земли со скоростью ${V} м/с. Найдите скорость тела относительно земли, считая направление системы положительным.`,a,u:'м/с',steps:[r`Преобразование Галилея: $v=v'+V$.`,r`С учётом направления: $v=${same?vp+'+'+V:V+'-'+vp}=${a}$ м/с.`]};}},
    {id:'g7',q:'Ускорение по второму закону',gen:()=>{const m=RI(2,12),F=RI(10,100),a=sig(F/m,4);return {q:`Равнодействующая сила ${F} Н действует на тело массой ${m} кг. Найдите ускорение.`,a,u:'м/с²',steps:[r`$a=F/m$.`,r`$a=${F}/${m}\approx ${nm(a)}$ м/с².`]};}},
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Брусок массой 4 кг на горизонтальном столе соединён лёгкой нитью через блок с подвешенным грузом массой 3 кг. Коэффициент трения скольжения бруска 0,20. Найдите ускорение системы. Принять g = 9,8 м/с².',a:3.08,u:'м/с²',steps:[r`Сила трения бруска $F_{тр}=\mu m_1g=0{,}20\cdot4\cdot9{,}8=7{,}84$ Н.`,r`Для всей системы вдоль движения: $m_2g-F_{тр}=(m_1+m_2)a$.`,r`$a=(3\cdot9{,}8-7{,}84)/(4+3)=21{,}56/7=3{,}08$ м/с².`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Лифт движется вверх с ускорением 1,5 м/с². В лифте на весах стоит человек массой 60 кг. Найдите показание весов (реакцию опоры). Принять g = 9,8 м/с².',a:678,u:'Н',steps:[r`На человека действуют сила тяжести $mg$ вниз и реакция опоры $N$ вверх.`,r`По второму закону Ньютона при ускорении вверх: $N-mg=ma$, поэтому $N=m(g+a)$.`,r`$N=60(9{,}8+1{,}5)=60\cdot11{,}3=678$ Н.`]},
  ]
});

T({
  id: 'rotdyn', ticket: 5, title: 'Динамика вращения',
  intro: 'Основное уравнение вращения $M=I\\varepsilon$ повторяет второй закон Ньютона. Полезно держать таблицу соответствия перед глазами.',
  defs: [
    {t: 'Основное уравнение динамики вращения', d: 'Для тела, вращающегося вокруг неподвижной оси, главный момент внешних сил относительно этой оси равен скорости изменения момента импульса: $M_z=\\dfrac{dL_z}{dt}$. Если момент инерции постоянен, то $M_z=I_z\\varepsilon$.'},
    {t: 'Вывод для материальной точки', d: 'Для точки на расстоянии $r$ от оси при касательном ускорении $a_\\tau=\\varepsilon r$: $F_\\tau=ma_\\tau=m\\varepsilon r$. Момент этой силы $M=F_\\tau r=mr^2\\varepsilon=I\\varepsilon$, где $I=mr^2$. Для системы точек моменты и моменты инерции суммируют относительно одной и той же оси.'},
    {t: 'Таблица соответствия', d: 'Для вращения вокруг фиксированной оси величинам поступательного движения соответствуют: координате $x$ — угол $\\varphi$, скорости $v$ — угловая скорость $\\omega$, ускорению $a$ — угловое ускорение $\\varepsilon$, массе $m$ — момент инерции $I$, силе $F$ — момент силы $M$, импульсу $p$ — момент импульса $L$, кинетической энергии $mv^2/2$ — энергии вращения $I\\omega^2/2$.'},
    {t: 'Главные оси инерции', d: 'Главные оси инерции — оси, проходящие через центр масс тела и являющиеся главными направлениями тензора инерции. Для тел с соответствующей симметрией они совпадают с осями симметрии. Это определение не означает, что тело обязано вращаться вокруг такой оси без внешнего закрепления.'},
    {t: 'Свободные оси', d: 'Свободное вращение твёрдого тела — вращение без закреплённой оси под действием только внутренних взаимодействий. Для динамики такого вращения важны главные оси инерции; утверждение об устойчивости вращения требует уточнения условий и не является определением главной оси.'},
    {t: 'Момент силы относительно оси', d: 'Момент силы относительно оси характеризует вращательное действие силы. Его модуль можно найти как произведение плеча силы на проекцию силы на плоскость, перпендикулярную оси: $M=F_\\perp l$, где $l$ — кратчайшее расстояние от оси до линии действия силы. Знак момента зависит от выбранного положительного направления вращения.'},
    {t: 'Момент инерции', d: 'Момент инерции относительно заданной оси зависит от распределения массы относительно этой оси. Для материальной точки $I=mr^2$, для системы точек $I=\\sum_i m_i r_i^2$, для сплошного тела $I=\\int r^2\\,dm$, где $r$ — расстояние элемента массы до оси.'},
    {t: 'Момент импульса относительно оси', d: 'Для тела, вращающегося вокруг неподвижной оси, момент импульса относительно этой оси равен $L_z=I_z\\omega$. При постоянном моменте инерции уравнение динамики вращения принимает вид $M_z=I_z\\varepsilon$.'},
    {t: 'Теорема Штейнера', d: 'Момент инерции относительно оси равен моменту инерции относительно параллельной оси, проходящей через центр масс, плюс произведение массы тела на квадрат расстояния между осями: $I=I_C+md^2$.'}
  ],
  formulas: [
    {n: 'Основное уравнение', f: r`M=I\varepsilon`, d: 'Для фиксированной оси.'},
    {n: 'Через момент импульса', f: r`M=\frac{dL}{dt}`, d: 'Верно и при переменном моменте инерции.'},
    {n: 'Кинетическая энергия вращения', f: r`W_k=\frac{I\omega^2}{2}`, d: 'Аналог $mv^2/2$.'},
    {n: 'Качение без проскальзывания', f: r`W_k=\frac{mv^2}{2}+\frac{I\omega^2}{2},\quad v=\omega R`, d: 'Поступательная плюс вращательная части.'},
    {n: 'Работа при вращении', f: r`A=\int M\,d\varphi`, d: r`При постоянном $M$: $A=M\varphi$.`},
    {n: 'Мощность при вращении', f: r`N=M\omega`, d: 'Аналог $N=Fv$.'},
    {n: 'Условие равновесия рычага', f: r`\sum M_i=0`, d: 'Сумма моментов относительно любой оси равна нулю.'}
  ],
  examples: [
    {t:'Основное уравнение динамики вращения',uses:r`$M=I\varepsilon$, $M=dL/dt$`,q:r`Ротор имеет момент инерции 0,8 кг·м². Постоянный момент сил равен 3,2 Н·м. Найдите угловое ускорение.`,steps:[r`Для постоянного момента инерции $M=I\varepsilon$, откуда $\varepsilon=M/I$.`,r`$\varepsilon=3{,}2/0{,}8=4$ рад/с².`],a:r`4 рад/с²`},
    {t:'Энергия вращения и качение',uses:r`$W_k=I\omega^2/2$, $v=\omega R$`,q:r`Диск массой 4 кг и радиусом 0,5 м катится без проскальзывания со скоростью 3 м/с. Для диска $I=mR^2/2$. Найдите полную кинетическую энергию.`,steps:[r`$\omega=v/R=3/0{,}5=6$ рад/с; $I=mR^2/2=4\cdot0{,}25/2=0{,}5$ кг·м².`,r`$W=mv^2/2+I\omega^2/2=4\cdot9/2+0{,}5\cdot36/2=18+9=27$ Дж.`],a:r`27 Дж`},
    {t:'Работа и мощность при вращении',uses:r`$A=\int M\,d\varphi$, $N=M\omega$`,q:r`Постоянный момент 5 Н·м поворачивает вал на 3 рад за 2 с при постоянной угловой скорости. Найдите работу и мощность.`,steps:[r`При постоянном моменте $A=M\varphi=5\cdot3=15$ Дж.`,r`Угловая скорость $\omega=\varphi/t=3/2=1{,}5$ рад/с; мощность $N=M\omega=5\cdot1{,}5=7{,}5$ Вт.`],a:r`15 Дж; 7,5 Вт`},
    {t:'Равновесие рычага и теорема Штейнера',uses:r`$\sum M_i=0$, $I=I_C+md^2$`,q:r`К рычагу приложены силы 20 Н и 10 Н по разные стороны оси, на плечах 0,3 м и 0,6 м. Установится ли равновесие? Дополнительно: для тела массой 2 кг с $I_C=0{,}4$ кг·м² найдите момент инерции относительно параллельной оси на расстоянии 0,5 м.`,steps:[r`Моменты сил: $M_1=20\cdot0{,}3=6$ Н·м и $M_2=10\cdot0{,}6=6$ Н·м; они противоположны, поэтому сумма моментов равна нулю.`,r`По теореме Штейнера $I=I_C+md^2=0{,}4+2\cdot0{,}5^2=0{,}9$ кг·м².`],a:r`Равновесие; 0,9 кг·м²`}
  ],
  problems: [
    {q: 'На тело с моментом инерции 0,5 кг·м² действует момент силы 2 Н·м. Найдите угловое ускорение.', a: 4, u: 'рад/с²', steps: [r`$\varepsilon=\dfrac{M}{I}=\dfrac{2}{0{,}5}=4$ рад/с².`]},
    {q: 'Сила 30 Н действует на рычаг на расстоянии 0,4 м от оси перпендикулярно рычагу. Чему равен момент силы?', a: 12, u: 'Н·м', steps: [r`$M=Fl=30\cdot0{,}4=12$ Н·м.`]},
    {q: 'Однородный диск массой 2 кг и радиусом 0,2 м. К ободу приложена касательная сила 4 Н. Найдите угловое ускорение.', a: 20, u: 'рад/с²', steps: [r`$M=FR=4\cdot0{,}2=0{,}8$ Н·м.`, r`$I=\dfrac12mR^2=\dfrac12\cdot2\cdot0{,}04=0{,}04$ кг·м².`, r`$\varepsilon=\dfrac{M}{I}=\dfrac{0{,}8}{0{,}04}=20$ рад/с².`]},
    {q: 'Маховик с моментом инерции 0,04 кг·м² вращается с угловой скоростью 10 рад/с. Найдите кинетическую энергию.', a: 2, u: 'Дж', steps: [r`$W_k=\dfrac{I\omega^2}{2}=\dfrac{0{,}04\cdot100}{2}=2$ Дж.`]},
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Однородный диск массой 6 кг и радиусом 0,4 м вращается вокруг неподвижной оси через центр. К ободу приложена касательная сила 12 Н. Найдите угловое ускорение диска.',a:10,u:'рад/с²',steps:[r`Момент силы $M=FR=12\cdot0{,}4=4{,}8$ Н·м.`,r`Момент инерции диска $I=\frac12mR^2=\frac12\cdot6\cdot0{,}4^2=0{,}48$ кг·м².`,r`По основному уравнению динамики вращения $M=I\varepsilon$: $\varepsilon=M/I=4{,}8/0{,}48=10$ рад/с².`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Колесо радиусом 0,25 м катится без проскальзывания со скоростью центра масс 4 м/с. Момент инерции колеса относительно оси через центр равен 0,8 кг·м², масса колеса 10 кг. Найдите полную кинетическую энергию.',a:182.4,u:'Дж',steps:[r`При качении без скольжения $\omega=v/R=4/0{,}25=16$ рад/с.`,r`Поступательная энергия $W_{п}=mv^2/2=10\cdot4^2/2=80$ Дж.`,r`Вращательная энергия $W_{вр}=I\omega^2/2=0{,}8\cdot16^2/2=102{,}4$ Дж.`,r`Полная энергия $W=80+102{,}4=182{,}4$ Дж.`]}
  ]
});

T({
  id: 'system', ticket: 6, title: 'Система тел. Центр масс. Закон сохранения импульса',
  intro: 'Внутренние силы не меняют импульс системы. Центр масс движется так, как если бы вся масса была в нём, а все внешние силы приложены к нему.',
  defs: [
    {t: 'Система материальных точек', d: 'Совокупность материальных точек, рассматриваемых как единая система. Силы взаимодействия между точками этой системы — внутренние; силы со стороны тел, не входящих в систему, — внешние.'},
    {t: 'Замкнутая система', d: 'В принятой в задачах модели замкнутой называют систему, на которую внешние силы не действуют либо их равнодействующая равна нулю. Для сохранения импульса достаточно, чтобы суммарный внешний импульс за рассматриваемый промежуток был равен нулю.'},
    {t: 'Центр масс', d: 'Центр масс системы — точка, радиус-вектор которой равен взвешенному по массам среднему радиус-векторов её точек: $\\vec R_c=\\dfrac{\\sum_i m_i\\vec r_i}{\\sum_i m_i}$. Обозначение «центр инерции» также встречается в задачнике.'},
    {t: 'Свойства центра масс замкнутой системы', d: 'Если равнодействующая внешних сил равна нулю, центр масс покоится или движется равномерно и прямолинейно. Импульс системы связан со скоростью центра масс соотношением $\\vec P=M\\vec v_c$, где $M=\\sum_i m_i$ — полная масса системы.'},
    {t: 'Закон сохранения импульса', d: 'Если равнодействующая внешних сил равна нулю, полный импульс системы остаётся постоянным: $\\vec P=\\sum_i m_i\\vec v_i=\\mathrm{const}$. Для кратковременных взаимодействий также используют условие, что внешним импульсом за время взаимодействия можно пренебречь.'},
    {t: 'Абсолютно неупругий удар', d: 'Столкновение, после которого тела движутся вместе с общей скоростью. При пренебрежимо малом внешнем импульсе полный импульс сохраняется; кинетическая энергия, вообще говоря, не сохраняется.'},
    {t: 'Абсолютно упругий удар', d: 'Столкновение, при котором сохраняются полный импульс системы и её суммарная кинетическая энергия, если внешним импульсом за время столкновения можно пренебречь.'},
    {t: 'Импульс тела', d: 'Импульс материальной точки — векторная величина $\\vec p=m\\vec v$, равная произведению массы на скорость. Импульс системы равен векторной сумме импульсов всех её точек.'},
    {t: 'Импульс силы', d: 'Импульс силы за промежуток времени равен изменению импульса тела: $\\Delta\\vec p=\\int_{t_1}^{t_2}\\vec F\\,dt$. При постоянной силе $\\Delta\\vec p=\\vec F\\Delta t$.'},
    {t: 'Уравнение движения центра масс', d: 'Произведение полной массы системы на ускорение её центра масс равно равнодействующей внешних сил: $M\\vec a_c=\\vec F_{\\text{внеш}}$. Внутренние силы в это уравнение как результирующая системы не входят.'}
  ],
  formulas: [
    {n: 'Центр масс', f: r`\vec R_c=\frac{\sum m_i\vec r_i}{\sum m_i}`, d: r`Для двух тел на оси: $x_c=\dfrac{m_1x_1+m_2x_2}{m_1+m_2}$.`},
    {n: 'Импульс системы', f: r`\vec P=\sum m_i\vec v_i=M\vec v_c`, d: ''},
    {n: 'Уравнение движения центра масс', f: r`M\vec a_c=\vec F_{внеш}`, d: 'Сумма только внешних сил.'},
    {n: 'Закон сохранения импульса', f: r`\sum\vec p_i=\text{const}\ \ (\vec F_{внеш}=0)`, d: 'Выполняется для каждой проекции отдельно.'},
    {n: 'Теорема об импульсе', f: r`\vec F\,\Delta t=\Delta\vec p`, d: 'Левая часть — импульс силы.'},
    {n: 'Неупругий удар', f: r`m_1v_1+m_2v_2=(m_1+m_2)u`, d: ''},
    {n: 'Реактивное движение', f: r`m\,dv=-u\,dm,\quad \Delta v=u\ln\frac{m_0}{m}`, d: 'u — скорость истечения относительно ракеты; dm<0 для убывающей массы. Интегральная формула предполагает постоянную u и отсутствие внешних сил.'}
  ],
  examples: [
    {t:'Центр масс системы',uses:r`$\vec R_c=\sum m_i\vec r_i/\sum m_i$`,q:r`Два тела массами 2 кг и 6 кг находятся на оси в точках x = 4 м и x = 0 м. Найдите координату центра масс.`,steps:[r`$x_c=(m_1x_1+m_2x_2)/(m_1+m_2)$.`,r`$x_c=(2\cdot4+6\cdot0)/(2+6)=1$ м.`],a:r`1 м`},
    {t:'Импульс системы и движение центра масс',uses:r`$\vec P=M\vec v_c$, $M\vec a_c=\vec F_{\text{внеш}}$`,q:r`Система общей массой 5 кг имеет скорость центра масс 2 м/с. На неё действует внешняя равнодействующая 10 Н вдоль движения. Найдите импульс системы и ускорение центра масс.`,steps:[r`Импульс системы $P=Mv_c=5\cdot2=10$ кг·м/с.`,r`По уравнению центра масс $a_c=F_{\text{внеш}}/M=10/5=2$ м/с².`],a:r`10 кг·м/с; 2 м/с²`},
    {t:'Импульс силы',uses:r`$\Delta\vec p=\vec F\Delta t$`,q:r`На тело действует постоянная сила 12 Н в течение 0,5 с. Найдите изменение импульса тела.`,steps:[r`Для постоянной силы $\Delta p=F\Delta t$.`,r`$\Delta p=12\cdot0{,}5=6$ кг·м/с, в направлении силы.`],a:r`6 кг·м/с`},
    {t:'Неупругий удар и реактивное движение',uses:r`$m_1v_1+m_2v_2=(m_1+m_2)u$`,q:r`Тележка массой 3 кг движется со скоростью 4 м/с и сцепляется с неподвижной тележкой массой 1 кг. Найдите общую скорость после удара.`,steps:[r`Выберем направление первой тележки за положительное. До удара $P=3\cdot4+1\cdot0=12$ кг·м/с.`,r`После удара тележки движутся вместе: $u=P/(m_1+m_2)=12/4=3$ м/с.`],a:r`3 м/с`}
,
    {t:'Реактивное движение: уравнение Циолковского',uses:r`$m\,dv=-u\,dm$; $\Delta v=u\ln(m_0/m)$`,q:r`Ракета без внешних сил уменьшает массу с 1000 кг до 800 кг, выбрасывая газ с постоянной скоростью 2000 м/с относительно ракеты. Найдите приращение скорости.`,steps:[r`Для ракеты с постоянной относительной скоростью истечения $u$ интегрирование $m\,dv=-u\,dm$ даёт формулу Циолковского: $\Delta v=u\ln(m_0/m)$.`,r`$\Delta v=2000\ln(1000/800)=2000\ln(1{,}25)\approx446$ м/с.`,r`Масса ракеты уменьшается, поэтому приращение скорости направлено противоположно выбрасываемому газу.`],a:r`$\Delta v\approx446$ м/с`},
  ],
  problems: [
    {q: 'Массы 2 кг и 3 кг находятся на оси в точках x = 0 и x = 5 м. Где центр масс?', a: 3, u: 'м', steps: [r`$x_c=\dfrac{m_1x_1+m_2x_2}{m_1+m_2}=\dfrac{2\cdot0+3\cdot5}{5}=3$ м.`]},
    {q: 'Тело массой 2 кг со скоростью 6 м/с налетает на неподвижное тело массой 4 кг и слипается с ним. Найдите общую скорость.', a: 2, u: 'м/с', steps: [r`Закон сохранения импульса: $m_1v_1=(m_1+m_2)u$.`, r`$u=\dfrac{2\cdot6}{6}=2$ м/с.`]},
    {q: 'Орудие массой 1000 кг стреляет снарядом 10 кг со скоростью 200 м/с. Найдите модуль скорости отката.', a: 2, u: 'м/с', steps: [r`До выстрела импульс нулевой: $0=mv-MV$.`, r`$V=\dfrac{mv}{M}=\dfrac{10\cdot200}{1000}=2$ м/с.`]},
    {q: 'На тело массой 5 кг действует сила 50 Н в течение 0,2 с. Как изменится скорость?', a: 2, u: 'м/с', steps: [r`$F\Delta t=m\Delta v$.`, r`$\Delta v=\dfrac{50\cdot0{,}2}{5}=2$ м/с.`]},
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Тележка массой 2 кг движется со скоростью 6 м/с и сталкивается с неподвижной тележкой массой 4 кг. После абсолютно неупругого столкновения они сцепляются. Найдите общую скорость.',a:2,u:'м/с',steps:[r`Закон сохранения импульса: $m_1v_1=(m_1+m_2)u$.`,r`$u=\dfrac{m_1v_1}{m_1+m_2}=\dfrac{2\cdot6}{2+4}=2$ м/с.`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Два тела массами 3 кг и 2 кг движутся навстречу друг другу со скоростями 4 м/с и 5 м/с соответственно. После абсолютно неупругого столкновения они движутся вместе. Найдите скорость после столкновения, указав направление относительно движения первого тела.',a:0.4,u:'м/с',steps:[r`Направление первого тела считаем положительным: $v_1=+4$ м/с, $v_2=-5$ м/с.`,r`По закону сохранения импульса $m_1v_1+m_2v_2=(m_1+m_2)u$.`,r`$u=\dfrac{3\cdot4+2\cdot(-5)}{3+2}=\dfrac{2}{5}=0{,}4$ м/с.`,r`Знак положительный, значит после столкновения система движется в направлении первого тела.`]}
  ]
});

T({
  id: 'angmom', ticket: 7, title: 'Закон сохранения момента импульса',
  intro: 'Если момент внешних сил равен нулю, момент импульса сохраняется. Следствия: фигурист, центральное поле, законы Кеплера.',
  defs: [
    {t: 'Момент импульса точки', d: '$\\vec L=\\vec r\\times m\\vec v$. Направлен вдоль оси вращения по правилу правого винта.'},
    {t: 'Уравнение моментов', d: 'Производная момента импульса по времени равна суммарному моменту внешних сил.'},
    {t: 'Закон сохранения момента импульса', d: 'Если суммарный момент внешних сил равен нулю, $\\vec L$ не меняется. Следует из изотропности пространства.'},
    {t: 'Центральное поле', d: 'Сила в любой точке направлена к одному центру (или от него) и зависит только от расстояния до него.'},
    {t: 'Сохранение плоскости движения', d: 'В центральном поле $\\vec M=0$, значит $\\vec L=\\text{const}$. Вектор $\\vec r$ всегда перпендикулярен $\\vec L$, поэтому траектория лежит в одной плоскости.'},
    {t: 'Секторная скорость', d: 'Площадь, которую радиус-вектор заметает за единицу времени. В центральном поле постоянна (второй закон Кеплера).'},
    {t: 'Момент внешних сил и момент импульса', d: String.raw`Векторное уравнение движения системы относительно выбранного начала отсчёта: $\dfrac{d\vec L}{dt}=\vec M_{\text{внеш}}$. Внутренние силы взаимного взаимодействия не меняют суммарный момент импульса системы, если их моменты попарно компенсируются.`},
    {t: 'Условие сохранения момента импульса', d: 'Суммарный момент внешних сил относительно выбранной точки равен нулю — тогда полный момент импульса относительно этой точки постоянен. Для движения вокруг неподвижной оси достаточно нулевого суммарного внешнего момента относительно этой оси.'},
    {t: 'Центральная сила', d: 'Сила, линия действия которой проходит через неподвижный центр, а модуль зависит только от расстояния до центра. Её момент относительно центра равен нулю, поэтому сохраняется момент импульса относительно этого центра.'},
    {t: 'Закон площадей', d: String.raw`При движении под действием центральной силы радиус-вектор заметает равные площади за равные промежутки времени: $\Delta S/\Delta t=\text{const}$. Это следствие сохранения момента импульса, а не отдельное условие о постоянстве скорости.`}
  ],
  formulas: [
    {n: 'Момент импульса точки', f: r`\vec L=\vec r\times\vec p,\quad L=mvr\sin\alpha`, d: 'Для круговой орбиты $L=mvr$.'},
    {n: 'Момент импульса тела', f: r`L=I\omega`, d: 'Ось фиксирована.'},
    {n: 'Уравнение моментов', f: r`\frac{d\vec L}{dt}=\vec M`, d: ''},
    {n: 'Сохранение', f: r`I_1\omega_1=I_2\omega_2`, d: 'При $M_{внеш}=0$.'},
    {n: 'Секторная скорость', f: r`\frac{dS}{dt}=\frac{L}{2m}=\text{const}`, d: 'Равные площади за равные времена.'},
    {n: 'Момент центральной силы', f: r`\vec M=\vec r\times\vec F=0`, d: 'Радиус-вектор и центральная сила коллинеарны.'}
  ],
  examples: [
    {t:'Момент импульса точки',uses:r`$L=mvr\sin\alpha$`,q:r`Точка массой 0,5 кг движется со скоростью 8 м/с. Расстояние до точки отсчёта 0,4 м, угол между радиус-вектором и скоростью 30°. Найдите модуль момента импульса.`,steps:[r`$L=mvr\sin\alpha$.`,r`$L=0{,}5\cdot8\cdot0{,}4\cdot\sin30^\circ=0{,}8$ кг·м²/с.`],a:r`0,8 кг·м²/с`},
    {t:'Сохранение момента импульса тела',uses:r`$L=I\omega$, $I_1\omega_1=I_2\omega_2$`,q:r`Момент инерции вращающегося тела уменьшается с 6 до 2 кг·м². Начальная угловая скорость 3 рад/с. Внешний момент пренебрежимо мал. Найдите конечную угловую скорость.`,steps:[r`$I_1\omega_1=I_2\omega_2$.`,r`$\omega_2=I_1\omega_1/I_2=6\cdot3/2=9$ рад/с.`],a:r`9 рад/с`},
    {t:'Центральная сила и плоскость движения',uses:r`$\vec M=\vec r\times\vec F=0$, $d\vec L/dt=\vec M$`,q:r`На частицу действует только центральная сила. Как изменяется вектор момента импульса относительно центра?`,steps:[r`Для центральной силы $\vec F$ параллельна $\vec r$, поэтому $\vec M=\vec r\times\vec F=0$.`,r`Из $d\vec L/dt=\vec M$ следует $d\vec L/dt=0$, то есть $\vec L=\text{const}$: сохраняются его модуль и направление.`],a:r`Вектор момента импульса постоянен`},
    {t:'Секторная скорость',uses:r`$dS/dt=L/(2m)$`,q:r`Масса спутника 500 кг, его момент импульса относительно центра планеты равен 3,0·10⁹ кг·м²/с. Найдите секторную скорость.`,steps:[r`$\dfrac{dS}{dt}=\dfrac{L}{2m}$.`,r`$\dfrac{dS}{dt}=\dfrac{3{,}0\cdot10^9}{2\cdot500}=3{,}0\cdot10^6$ м²/с.`],a:r`3,0·10⁶ м²/с`},
    {t:'Закон площадей',uses:r`$dS/dt=\text{const}$`,q:r`Спутник за 2 ч заметает площадь 1,2·10⁷ км². Сколько площади он заметёт за следующие 5 ч при движении в центральном поле?`,steps:[r`Секторная скорость постоянна, поэтому площадь пропорциональна времени.`,r`За 5 ч: $S=1{,}2\cdot10^7\cdot5/2=3{,}0\cdot10^7$ км².`],a:r`3,0·10⁷ км²`}
  ],
  problems: [
    {q: 'Момент инерции тела 0,4 кг·м², угловая скорость 5 рад/с. Найдите момент импульса.', a: 2, u: 'кг·м²/с', steps: [r`$L=I\omega=0{,}4\cdot5=2$ кг·м²/с.`]},
    {q: 'Шарик массой 0,2 кг движется по окружности радиуса 0,5 м со скоростью 10 м/с. Найдите момент импульса относительно центра.', a: 1, u: 'кг·м²/с', steps: [r`Скорость перпендикулярна радиусу, $\sin\alpha=1$.`, r`$L=mvr=0{,}2\cdot10\cdot0{,}5=1$ кг·м²/с.`]},
    {q: 'Фигурист вращается с угловой скоростью 2 рад/с, момент инерции 4 кг·м². Он прижимает руки, момент инерции становится 2 кг·м². Найдите новую угловую скорость.', a: 4, u: 'рад/с', steps: [r`Внешних моментов нет, $I_1\omega_1=I_2\omega_2$.`, r`$\omega_2=\dfrac{4\cdot2}{2}=4$ рад/с.`]},
    {q: 'Тело массой 2 кг движется в центральном поле, момент импульса 4 кг·м²/с. Найдите секторную скорость.', a: 1, u: 'м²/с', steps: [r`$\dfrac{dS}{dt}=\dfrac{L}{2m}=\dfrac{4}{4}=1$ м²/с.`]}
,
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Спутник движется по эллиптической орбите в центральном гравитационном поле. В точке A расстояние до центра равно 8,0·10⁶ м, скорость 7,0 км/с; в точке B расстояние равно 1,4·10⁷ м. Найдите скорость спутника в точке B, если момент импульса относительно центра сохраняется и скорость в обеих точках перпендикулярна радиус-вектору.',a:4,u:'км/с',steps:[r`В центральном поле момент импульса сохраняется: $m r_Av_A=m r_Bv_B$. Масса сокращается.`,r`$v_B=\dfrac{r_Av_A}{r_B}=\dfrac{8{,}0\cdot10^6\cdot7{,}0}{1{,}4\cdot10^7}=4{,}0$ км/с.`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Тело движется в центральном поле. Его масса 2 кг, момент импульса относительно центра 12 кг·м²/с. Какую площадь заметёт радиус-вектор за 15 с? Считать момент импульса постоянным.',a:45,u:'м²',steps:[r`Секторная скорость $\dot S=L/(2m)=12/(2\cdot2)=3$ м²/с.`,r`За время $t=15$ с площадь $S=\dot S t=3\cdot15=45$ м².`]},
    {id:'g1',q:'Момент импульса точки',gen:()=>{const m=RI(1,8),v=RI(2,15),r0=RI(2,10)/10,L=sig(m*v*r0,4);return {q:`Точка массой ${m} кг движется со скоростью ${v} м/с перпендикулярно радиус-вектору длиной ${nt(r0)} м. Найдите момент импульса.`,a:L,u:'кг·м²/с',steps:[r`$L=mvr$.`,r`$L=${m}\cdot${v}\cdot${nm(r0)}=${nm(L)}$ кг·м²/с.`]};}},
    {id:'g2',q:'Момент импульса вращающегося тела',gen:()=>{const I=RI(2,20)/2,w=RI(1,12),L=sig(I*w,4);return {q:`Тело вращается с угловой скоростью ${w} рад/с, момент инерции ${nt(I)} кг·м². Найдите момент импульса.`,a:L,u:'кг·м²/с',steps:[r`$L=I\omega$.`,r`$L=${nm(I)}\cdot${w}=${nm(L)}$ кг·м²/с.`]};}},
    {id:'g3',q:'Изменение угловой скорости',gen:()=>{const I1=RI(2,12),I2=RI(1,6),w1=RI(1,8),w2=sig(I1*w1/I2,4);return {q:`Момент инерции тела изменился с ${I1} до ${I2} кг·м². Начальная угловая скорость ${w1} рад/с. Найдите конечную угловую скорость при нулевом внешнем моменте.`,a:w2,u:'рад/с',steps:[r`$I_1\omega_1=I_2\omega_2$.`,r`$\omega_2=${I1}\cdot${w1}/${I2}=${nm(w2)}$ рад/с.`]};}},
    {id:'g4',q:'Секторная скорость',gen:()=>{const L=RI(2,20)*100,m=RI(1,10),S=sig(L/(2*m),4);return {q:`Момент импульса частицы ${L} кг·м²/с, масса ${m} кг. Найдите секторную скорость.`,a:S,u:'м²/с',steps:[r`$\dot S=L/(2m)$.`,r`$\dot S=${L}/(2\cdot${m})=${nm(S)}$ м²/с.`]};}},
    {id:'g5',q:'Момент центральной силы',gen:()=>{const F=RI(2,30),r0=RI(1,20)/10;return {q:`Сила ${F} Н направлена вдоль радиус-вектора к центру. Найдите момент силы относительно центра.`,a:0,u:'Н·м',steps:[r`$M=rF\sin\alpha$. Для центральной силы $\alpha=0$ или $180^\circ$.`,r`$M=${nm(r0)}\cdot${F}\cdot0=0$ Н·м.`]};}},
  ]
});
T({
  id: 'energy', ticket: 8, title: 'Энергия. Теорема о кинетической энергии',
  intro: 'Работа всех сил меняет кинетическую энергию. Работа консервативных сил меняет потенциальную. Вместе это даёт закон сохранения энергии.',
  defs: [
    {t: 'Кинетическая энергия', d: r`Энергия движения: $W_k=\dfrac{mv^2}{2}$. Всегда неотрицательна, зависит от системы отсчёта.`},
    {t: 'Теорема о кинетической энергии', d: r`Работа равнодействующей всех сил равна изменению кинетической энергии: $A=W_{k2}-W_{k1}$.`},
    {t: 'Полная механическая энергия', d: r`Сумма кинетической и потенциальной энергий: $W=W_k+W_p$.`},
    {t: 'Консервативные силы', d: r`Силы, работа которых не зависит от формы пути, а по замкнутому контуру равна нулю. Тяжесть, упругость, тяготение, кулоновская сила.`},
    {t: 'Неконсервативные силы', d: r`Работа зависит от пути. Трение и сопротивление (диссипативные) переводят механическую энергию в тепло.`},
    {t: 'Уравнение баланса энергии', d: r`Изменение полной механической энергии равно работе неконсервативных сил: $W_2-W_1=A_{нк}$.`},
    {t: 'Закон сохранения механической энергии', d: r`Если неконсервативные силы не совершают работы, $W_k+W_p=\text{const}$. Следует из однородности времени.`},
    {t: 'Работа силы', d: r`Работа силы при перемещении определяется линейным интегралом $A=\int_1^2 \vec F\cdot d\vec r$. Для постоянной силы $A=Fs\cos\alpha$; работа — скалярная величина, единица СИ — джоуль.`},
    {t: 'Потенциальная энергия', d: r`Потенциальная энергия характеризует взаимодействие тел в консервативном поле. Её значение определено с точностью до произвольной постоянной; работа консервативной силы $A_{12}=W_{p1}-W_{p2}=-\Delta W_p$.`},
    {t: 'Мощность', d: r`Мгновенная мощность силы — скорость совершения работы: $N=dA/dt=\vec F\cdot\vec v$. Единица СИ — ватт.`},
    {t: 'Примеры потенциальной энергии', d: r`Вблизи поверхности Земли при постоянном $g$: $W_p=mgh$ относительно выбранного нулевого уровня. Для упругой пружины при деформации $x$: $W_p=kx^2/2$ при нуле энергии в положении равновесия.`},
    {t: 'Условия сохранения механической энергии', d: r`Механическая энергия сохраняется, если суммарная работа неконсервативных сил равна нулю. При наличии трения механическая энергия обычно уменьшается, переходя во внутреннюю энергию; полная энергия замкнутой системы при этом сохраняется.`}
  ],
  formulas: [
    {n: 'Кинетическая энергия', f: r`W_k=\frac{mv^2}{2}=\frac{p^2}{2m}`, d: r`Единицы: Дж.`},
    {n: 'Теорема о кинетической энергии', f: r`A_{\Sigma}=\Delta W_k`, d: r`Работа всех сил.`},
    {n: 'Баланс энергии', f: r`\Delta(W_k+W_p)=A_{нк}`, d: r`Для трения $A_{нк}<0$, энергия убывает.`},
    {n: 'Закон сохранения', f: r`\frac{mv_1^2}{2}+mgh_1=\frac{mv_2^2}{2}+mgh_2`, d: r`Пример для поля тяжести.`},
    {n: 'Скорость при падении с высоты', f: r`v=\sqrt{2gh}`, d: r`Без сопротивления воздуха.`},
    {n: 'Связь с мощностью', f: r`\frac{dW_k}{dt}=N`, d: r`Мощность равнодействующей силы.`},
    {n: 'Работа постоянной силы', f: r`A=Fs\cos\alpha`, d: 'Угол между силой и перемещением.'},
    {n: 'Потенциальная энергия пружины', f: r`W_p=\frac{kx^2}{2}`, d: 'Нуль энергии соответствует недеформированной пружине.'},
    {n: 'Мощность силы', f: r`N=\vec F\cdot\vec v=Fv\cos\alpha`, d: 'Для силы, совершающей работу над движущимся телом.'}
  ],
  examples: [
    {t:'Кинетическая энергия',uses:r`$W_k=mv^2/2=p^2/(2m)$`,q:r`Найдите кинетическую энергию тела массой 3 кг, движущегося со скоростью 4 м/с.`,steps:[r`$W_k=mv^2/2$.`,r`$W_k=3\cdot4^2/2=24$ Дж.`],a:r`24 Дж`},
    {t:'Теорема о кинетической энергии',uses:r`$A_\Sigma=\Delta W_k$`,q:r`Тело массой 2 кг увеличило скорость с 3 до 7 м/с. Найдите работу равнодействующей силы.`,steps:[r`$A_\Sigma=\Delta W_k=m(v_2^2-v_1^2)/2$.`,r`$A_\Sigma=2(49-9)/2=40$ Дж.`],a:r`40 Дж`},
    {t:'Баланс механической энергии',uses:r`$\Delta(W_k+W_p)=A_{нк}$`,q:r`Тело массой 1 кг падает с высоты 8 м и достигает земли со скоростью 10 м/с. При $g=10$ м/с² найдите работу силы сопротивления.`,steps:[r`$A_{нк}=E_2-E_1=mv^2/2-mgh$.`,r`$A_{нк}=1\cdot100/2-1\cdot10\cdot8=50-80=-30$ Дж.`],a:r`−30 Дж`},
    {t:'Потенциальная энергия пружины',uses:r`$W_p=kx^2/2$`,q:r`Пружина жёсткостью 200 Н/м растянута на 0,10 м. Найдите запасённую потенциальную энергию.`,steps:[r`$W_p=kx^2/2$.`,r`$W_p=200\cdot0{,}10^2/2=1$ Дж.`],a:r`1 Дж`},
    {t:'Мощность и скорость падения',uses:r`$N=dW_k/dt$, $N=Fv\cos\alpha$`,q:r`Сила 50 Н направлена вдоль скорости тела 6 м/с. Найдите мгновенную мощность этой силы.`,steps:[r`$N=Fv\cos0^\circ=Fv$.`,r`$N=50\cdot6=300$ Вт.`],a:r`300 Вт`},
    {t:'Работа постоянной силы',uses:r`$A=Fs\cos\alpha$`,q:r`Сила 20 Н перемещает тело на 3 м, угол между силой и перемещением 60°. Найдите работу силы.`,steps:[r`$A=Fs\cos\alpha$.`,r`$A=20\cdot3\cdot0{,}5=30$ Дж.`],a:r`30 Дж`}
  ],
  problems: [
    {q: r`Найдите кинетическую энергию тела массой 2 кг при скорости 10 м/с.`, a: 100, u: 'Дж', steps: [r`$W_k=\dfrac{mv^2}{2}=\dfrac{2\cdot100}{2}=100$ Дж.`]},
    {q: r`Тело массой 1 кг разгоняется от 2 м/с до 6 м/с. Какую работу совершила равнодействующая сила?`, a: 16, u: 'Дж', steps: [r`По теореме о кинетической энергии $A=\dfrac{m}{2}(v_2^2-v_1^2)$.`, r`$A=\dfrac12(36-4)=16$ Дж.`]},
    {q: r`Тело падает с высоты 20 м без начальной скорости. Найдите скорость у земли. g = 10 м/с².`, a: 20, u: 'м/с', steps: [r`$mgh=\dfrac{mv^2}{2}\Rightarrow v=\sqrt{2gh}$.`, r`$v=\sqrt{2\cdot10\cdot20}=\sqrt{400}=20$ м/с.`]},
    {q: r`Санки съезжают без трения с горки высотой 5 м. Какова скорость внизу? g = 10 м/с².`, a: 10, u: 'м/с', steps: [r`$v=\sqrt{2gh}=\sqrt{100}=10$ м/с.`]},
    {q: r`Тело массой 2 кг падает с высоты 10 м и у земли имеет скорость 12 м/с. Какую работу совершила сила сопротивления (по модулю)? g = 10 м/с².`, a: 56, u: 'Дж', steps: [r`Потеря энергии: $mgh-\dfrac{mv^2}{2}$.`, r`$2\cdot10\cdot10-\dfrac{2\cdot144}{2}=200-144=56$ Дж.`]}
,
    {id:'hard1',level:'hard',q:'Экзаменационная задача 1. Брусок массой 2 кг соскальзывает без трения с высоты 3,2 м, затем движется по горизонтальному участку с трением и останавливается после пути 4 м. Найдите коэффициент трения на горизонтальном участке. Принять g = 10 м/с².',a:0.8,u:'',steps:[r`На спуске механическая энергия сохраняется: у основания $mv^2/2=mgh$, поэтому $v^2=2gh$.`,r`На горизонтальном участке работа трения равна убыли кинетической энергии: $\mu mg s=mv^2/2=mgh$.`,r`Отсюда $\mu=h/s=3{,}2/4=0{,}8$.`]},
    {id:'hard2',level:'hard',q:'Экзаменационная задача 2. Пружина жёсткостью 400 Н/м сжата на 0,20 м и разгоняет брусок массой 2 кг по гладкой горизонтальной поверхности. Найдите скорость бруска в момент, когда пружина возвращается к недеформированному состоянию.',a:2.83,u:'м/с',steps:[r`На гладкой поверхности механическая энергия сохраняется: $kx^2/2=mv^2/2$.`,r`$v=x\sqrt{k/m}=0{,}20\sqrt{400/2}=2{,}828\ldots$ м/с.`,r`Округляя до трёх значащих цифр, $v=2{,}83$ м/с.`]},
    {id:'g1',q:'Кинетическая энергия',gen:()=>{const m=RI(1,15),v=RI(2,20),a=sig(m*v*v/2,4);return {q:`Найдите кинетическую энергию тела массой ${m} кг при скорости ${v} м/с.`,a,u:'Дж',steps:[r`$W_k=mv^2/2$.`,r`$W_k=${m}\cdot${v}^2/2=${nm(a)}$ Дж.`]};}},
