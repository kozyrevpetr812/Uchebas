    {q: r`Проводник длиной 0,2 м с током 4 А находится в поле 0,5 Тл перпендикулярно линиям. Найдите силу Ампера.`, a: 0.4, u: 'Н', steps: [r`$F=BIl=0{,}5\cdot4\cdot0{,}2=0{,}4$ Н.`]},
    {q: r`Найдите индукцию поля прямого провода с током 10 А на расстоянии 0,1 м. Введите в виде 2e-5.`, a: 2e-5, u: 'Тл', steps: [r`$B=\dfrac{\mu_0I}{2\pi r}=\dfrac{4\pi\cdot10^{-7}\cdot10}{2\pi\cdot0{,}1}=2\cdot10^{-5}$ Тл.`]},
    {q: r`Магнитный поток через контур равномерно уменьшился с 0,5 Вб до 0,1 Вб за 0,2 с. Найдите модуль ЭДС индукции.`, a: 2, u: 'В', steps: [r`$|\mathcal E|=\dfrac{\Delta\Phi}{\Delta t}=\dfrac{0{,}4}{0{,}2}=2$ В.`]},
    {q: r`Проводник длиной 0,5 м движется со скоростью 4 м/с перпендикулярно полю 0,2 Тл. Найдите ЭДС.`, a: 0.4, u: 'В', steps: [r`$\mathcal E=Blv=0{,}2\cdot0{,}5\cdot4=0{,}4$ В.`]},
    {q: r`Протон (m = 1,67·10⁻²⁷ кг) со скоростью 10⁶ м/с в поле 1 Тл перпендикулярно линиям. Найдите радиус орбиты.`, a: 0.01044, u: 'м', tol: 0.02, steps: [r`$R=\dfrac{mv}{qB}=\dfrac{1{,}67\cdot10^{-27}\cdot10^6}{1{,}6\cdot10^{-19}\cdot1}\approx0{,}0104$ м.`]},
    {id:'g1',q:'Сила Лоренца',gen:()=>{const v=RI(1,9)*1e6,B=RI(1,8)/100,q=1.6e-19,a=sig(q*v*B,5);return {q:`Заряд по модулю ${q} Кл движется со скоростью ${v} м/с перпендикулярно полю ${nt(B)} Тл. Найдите силу.`,a,u:'Н',steps:[r`$F=|q|vB$.`,r`$F=1{,}6\cdot10^{-19}\cdot${v}\cdot${nm(B)}=${nm(a)}$ Н.`]};}},
    {id:'g2',q:'Радиус орбиты',gen:()=>{const m=1.67e-27,v=RI(1,8)*1e6,B=RI(1,8)/10,q=1.6e-19,a=sig(m*v/(q*B),5);return {q:`Протон движется перпендикулярно полю ${nt(B)} Тл со скоростью ${v} м/с. Найдите радиус траектории.`,a,u:'м',steps:[r`$R=\dfrac{mv}{qB}$.`,r`$R=\dfrac{1{,}67\cdot10^{-27}\cdot${v}}{1{,}6\cdot10^{-19}\cdot${nm(B)}}=${nm(a)}$ м.`]};}},
    {id:'g3',q:'Магнитный поток',gen:()=>{const B=RI(1,8)/10,S=RI(1,9)/100,ang=PICK([0,30,60]),a=sig(B*S*Math.cos(ang*Math.PI/180),5);return {q:`Поле ${nt(B)} Тл, площадь контура ${nt(S)} м², угол между полем и нормалью ${ang}°. Найдите магнитный поток.`,a,u:'Вб',steps:[r`$\Phi=BS\cos\alpha$.`,r`$\Phi=${nm(B)}\cdot${nm(S)}\cdot\cos${ang}^\circ=${nm(a)}$ Вб.`]};}},
    {id:'g4',q:'ЭДС индукции',gen:()=>{const dPhi=RI(1,9)/1000,t=RI(1,9)/100,a=sig(dPhi/t,5);return {q:`Модуль изменения магнитного потока ${nt(dPhi)} Вб за ${nt(t)} с. Найдите модуль средней ЭДС.`,a,u:'В',steps:[r`$|\mathcal E|=\left|\dfrac{\Delta\Phi}{\Delta t}\right|$.`,r`$|\mathcal E|=\dfrac{${nm(dPhi)}}{${nm(t)}}=${nm(a)}$ В.`]};}},
    {id:'g5',q:'Энергия катушки',gen:()=>{const L=RI(1,10)/10,I=RI(1,8),a=sig(L*I*I/2,5);return {q:`Индуктивность катушки ${nt(L)} Гн, ток ${I} А. Найдите энергию магнитного поля.`,a,u:'Дж',steps:[r`$W=\dfrac{LI^2}{2}$.`,r`$W=\dfrac{${nm(L)}\cdot${I}^2}{2}=${nm(a)}$ Дж.`]};}},
    {q:r`Экзаменационная задача 1. Протон движется со скоростью 3·10⁶ м/с перпендикулярно магнитному полю 0,15 Тл. Найдите радиус траектории и период обращения. m = 1,67·10⁻²⁷ кг, q = 1,6·10⁻¹⁹ Кл.`,a:0.209,u:'м',tol:0.03,steps:[r`$R=mv/(qB)=1{,}67\cdot10^{-27}\cdot3\cdot10^6/(1{,}6\cdot10^{-19}\cdot0{,}15)\approx0{,}209$ м.`,r`$T=2\pi m/(qB)\approx4{,}37\cdot10^{-7}$ с.`],id:'examMagnetA'},
    {q:r`Экзаменационная задача 2. Контур из 50 витков имеет площадь 0,01 м². Перпендикулярная составляющая поля равномерно меняется от 0,2 до 0,8 Тл за 0,1 с. Найдите модуль средней ЭДС индукции.`,a:3,u:'В',tol:0.02,steps:[r`$|\mathcal E|=N|\Delta\Phi|/\Delta t=NS|\Delta B|/\Delta t$.`,r`$|\mathcal E|=50\cdot0{,}01\cdot(0{,}8-0{,}2)/0{,}1=3$ В.`],id:'examMagnetB'}
  ]
});

T({
  id: 'optics', ticket: 0, title: 'Геометрическая и волновая оптика',
  intro: 'Свет — электромагнитная волна. При размерах предметов много больше длины волны работает геометрическая оптика (лучи).',
  defs: [
    {t: 'Показатель преломления', d: r`Отношение скорости света в вакууме к скорости в среде. Всегда $n\ge1$.`},
    {t: 'Закон отражения', d: r`Угол отражения равен углу падения. Лучи лежат в одной плоскости.`},
    {t: 'Закон преломления Снеллиуса', d: r`Отношение синусов углов падения и преломления равно отношению показателей преломления.`},
    {t: 'Полное внутреннее отражение', d: r`При переходе в менее плотную среду свет отражается целиком, если угол падения больше предельного.`},
    {t: 'Фокусное расстояние линзы', d: r`Расстояние от линзы до точки, где собираются параллельные оси лучи. У собирающей линзы положительное.`},
    {t: 'Оптическая сила', d: r`Величина, обратная фокусному расстоянию. Единицы: дптр.`},
    {t: 'Интерференция света', d: r`Сложение когерентных световых волн с образованием максимумов и минимумов освещённости.`},
    {t: 'Дифракция', d: r`Отклонение волн от прямолинейного распространения при встрече с препятствием.`},
    {t: 'Дифракционная решётка', d: r`Много параллельных щелей на одинаковом расстоянии $d$. Даёт чёткие максимумы по направлениям, зависящим от длины волны.`}
  ],
  formulas: [
    {n: 'Показатель преломления', f: r`n=\frac cv`, d: r`$c=3\cdot10^8$ м/с.`},
    {n: 'Закон преломления', f: r`n_1\sin\alpha=n_2\sin\beta`, d: r``},
    {n: 'Предельный угол', f: r`\sin\alpha_{пр}=\frac{n_2}{n_1},\quad n_1>n_2`, d: r``},
    {n: 'Формула тонкой линзы', f: r`\frac1F=\frac1d+\frac1f`, d: r`d — расстояние до предмета, f — до изображения.`},
    {n: 'Оптическая сила', f: r`D=\frac1F`, d: r``},
    {n: 'Линейное увеличение', f: r`\Gamma=\frac fd`, d: r``},
    {n: 'Условие максимума при интерференции', f: r`\Delta=m\lambda`, d: r`$\Delta$ — оптическая разность хода.`},
    {n: 'Условие минимума', f: r`\Delta=\left(m+\tfrac12\right)\lambda`, d: r``},
    {n: 'Дифракционная решётка', f: r`d\sin\varphi=m\lambda`, d: r`$m$ — порядок максимума.`}
  ],
  examples: [
    {t:'Скорость света и преломление',uses:'Показатель преломления; закон преломления',q:r`Свет входит из воздуха в стекло $n=1{,}5$ под углом 45°. Найдите скорость света в стекле и угол преломления.`,steps:[r`$v=c/n=3\cdot10^8/1{,}5=2\cdot10^8$ м/с.`,r`$\sin\beta=(1/1{,}5)\sin45^\circ\approx0{,}471$, поэтому $\beta\approx28{,}1^\circ$.`],a:r`$v=2\cdot10^8$ м/с; $\beta\approx28{,}1^\circ$.`},
    {t:'Полное внутреннее отражение',uses:'Предельный угол',q:r`Найдите предельный угол для перехода из стекла $n_1=1{,}5$ в воду $n_2=1{,}33$.`,steps:[r`$\sin\alpha_{пр}=n_2/n_1=1{,}33/1{,}5\approx0{,}887$.`,r`$\alpha_{пр}\approx62{,}5^\circ$. Полное отражение возможно при углах больше предельного.`],a:r`$\alpha_{пр}\approx62{,}5^\circ$.`},
    {t:'Тонкая линза и увеличение',uses:'Формула тонкой линзы; оптическая сила; линейное увеличение',q:r`Собирающая линза имеет $F=0{,}12$ м, предмет расположен в 0,36 м. Найдите расстояние до изображения, оптическую силу и модуль увеличения.`,steps:[r`$1/f=1/F-1/d=8{,}33-2{,}78=5{,}56$ м$^{-1}$, значит $f\approx0{,}18$ м.`,r`$D=1/F=8{,}33$ дптр; $|\Gamma|=f/d=0{,}5$.`],a:r`$f\approx0{,}18$ м; $D\approx8{,}33$ дптр; $|\Gamma|=0{,}5$.`},
    {t:'Интерференция',uses:'Условия максимума и минимума',q:r`Длина волны 600 нм. Найдите разность хода для максимума второго порядка и ближайшего минимума после него.`,steps:[r`Максимум: $\Delta=m\lambda=2\cdot600=1200$ нм.`,r`Ближайший минимум: $\Delta=(m+\frac12)\lambda=2{,}5\cdot600=1500$ нм.`],a:r`1200 нм и 1500 нм.`},
    {t:'Дифракционная решётка',uses:'Уравнение дифракционной решётки',q:r`Период решётки 2 мкм, длина волны 500 нм. Найдите угол максимума первого порядка.`,steps:[r`$\sin\varphi=m\lambda/d=500\cdot10^{-9}/(2\cdot10^{-6})=0{,}25$.`,r`$\varphi=\arcsin0{,}25\approx14{,}5^\circ$.`],a:r`$\varphi\approx14{,}5^\circ$.`}
  ],
  problems: [
    {q: r`Показатель преломления стекла 1,5. Найдите скорость света в нём. c = 3·10⁸ м/с. Введите в виде 2e8.`, a: 2e8, u: 'м/с', steps: [r`$v=\dfrac cn=\dfrac{3\cdot10^8}{1{,}5}=2\cdot10^8$ м/с.`]},
    {q: r`Луч падает из воздуха на стекло (n = 1,5) под углом 30°. Найдите угол преломления в градусах.`, a: 19.47, u: '°', tol: 0.01, steps: [r`$\sin\beta=\dfrac{\sin30^\circ}{1{,}5}=\dfrac{0{,}5}{1{,}5}=0{,}333$.`, r`$\beta=\arcsin0{,}333\approx19{,}47^\circ$.`]},
    {q: r`Фокусное расстояние линзы 0,1 м, предмет на расстоянии 0,3 м. Найдите расстояние до изображения.`, a: 0.15, u: 'м', steps: [r`$\dfrac1f=\dfrac1F-\dfrac1d=10-3{,}33=6{,}67$.`, r`$f=0{,}15$ м.`]},
    {q: r`Фокусное расстояние линзы 0,25 м. Найдите оптическую силу.`, a: 4, u: 'дптр', steps: [r`$D=\dfrac1F=\dfrac1{0{,}25}=4$ дптр.`]},
    {q: r`Дифракционная решётка с периодом 2 мкм освещена светом 500 нм. Под каким углом первый максимум? Ответ в градусах.`, a: 14.48, u: '°', tol: 0.01, steps: [r`$\sin\varphi=\dfrac{m\lambda}{d}=\dfrac{500\cdot10^{-9}}{2\cdot10^{-6}}=0{,}25$.`, r`$\varphi=\arcsin0{,}25\approx14{,}48^\circ$.`]},
    {q: r`Найдите предельный угол полного отражения на границе стекло (n = 1,5) — воздух, в градусах.`, a: 41.81, u: '°', tol: 0.01, steps: [r`$\sin\alpha_{пр}=\dfrac1{1{,}5}=0{,}667$.`, r`$\alpha_{пр}\approx41{,}81^\circ$.`]},
    {id:'g1',q:'Скорость света в среде',gen:()=>{const n=PICK([1.2,1.33,1.5,1.6]),a=sig(3e8/n,5);return {q:`Показатель преломления среды n = ${n}. Найдите скорость света.`,a,u:'м/с',steps:[r`$v=\dfrac cn$.`,r`$v=\dfrac{3\cdot10^8}{${nm(n)}}=${nm(a)}$ м/с.`]};}},
    {id:'g2',q:'Закон Снеллиуса',gen:()=>{const n2=PICK([1.33,1.5,1.6]),alpha=PICK([30,45,60]),a=sig(Math.asin(Math.sin(alpha*Math.PI/180)/n2)*180/Math.PI,5);return {q:`Луч идёт из воздуха в среду n = ${n2} под углом ${alpha}°. Найдите угол преломления.`,a,u:'°',steps:[r`$\sin\beta=\dfrac{\sin\alpha}{n}$.`,r`$\beta=\arcsin\left(\dfrac{\sin${alpha}^\circ}{${nm(n2)}}\right)\approx${nm(a)}^\circ$.`]};}},
    {id:'g3',q:'Формула тонкой линзы',gen:()=>{const F=RI(5,20)/100,d=RI(4,8)/10,a=sig(1/(1/F-1/d),5);return {q:`Собирающая линза с фокусным расстоянием ${nt(F)} м. Предмет находится на расстоянии ${nt(d)} м. Найдите расстояние до действительного изображения.`,a,u:'м',steps:[r`$\dfrac1f=\dfrac1F-\dfrac1d$.`,r`$f=\dfrac1{1/${nm(F)}-1/${nm(d)}}=${nm(a)}$ м.`]};}},
    {id:'g4',q:'Оптическая сила',gen:()=>{const F=RI(5,50)/100,a=sig(1/F,5);return {q:`Фокусное расстояние линзы ${nt(F)} м. Найдите оптическую силу.`,a,u:'дптр',steps:[r`$D=\dfrac1F$.`,r`$D=\dfrac1{${nm(F)}}=${nm(a)}$ дптр.`]};}},
    {id:'g5',q:'Дифракционная решётка',gen:()=>{const d=PICK([1,2,4])*1e-6,lam=PICK([400,500,600])*1e-9,m=1,a=sig(Math.asin(m*lam/d)*180/Math.PI,5);return {q:`Решётка с периодом ${nt(d*1e6)} мкм освещена светом ${nt(lam*1e9)} нм. Найдите угол максимума первого порядка.`,a,u:'°',steps:[r`$d\sin\varphi=m\lambda$.`,r`$\varphi=\arcsin\left(\dfrac{${nm(lam)}}{${nm(d)}}\right)\approx${nm(a)}^\circ$.`]};}},
    {q:r`Экзаменационная задача 1. Собирающая линза с фокусным расстоянием 15 см создаёт действительное изображение предмета, расположенного в 45 см от линзы. Найдите расстояние до изображения, оптическую силу и линейное увеличение по модулю.`,a:0.225,u:'м',tol:0.02,steps:[r`$1/f=1/F-1/d=1/0{,}15-1/0{,}45=4{,}444$ м$^{-1}$, значит $f=0{,}225$ м.`,r`$D=1/F=6{,}67$ дптр; $|\Gamma|=f/d=0{,}225/0{,}45=0{,}5$.`],id:'examOpticsA'},
    {q:r`Экзаменационная задача 2. Решётка с периодом 1,5 мкм освещена светом длиной волны 600 нм. Найдите угол максимума второго порядка и максимальный возможный порядок.`,a:53.13,u:'°',tol:0.02,steps:[r`$\sin\varphi=m\lambda/d=2\cdot600/1500=0{,}8$, поэтому $\varphi\approx53{,}13^\circ$.`,r`Максимальный порядок удовлетворяет $m\lambda\le d$: $m_{max}=\lfloor1500/600\rfloor=2$.`],id:'examOpticsB'}
  ]
});

T({
  id: 'quantum', ticket: 0, title: 'Квантовая и атомная физика',
  intro: 'Свет ведёт себя как поток частиц (фотонов), а частицы — как волны. Энергия атомов принимает только дискретные значения.',
  defs: [
    {t: 'Фотон', d: r`Квант электромагнитного излучения. Энергия $E=h\nu$, масса покоя нулевая, скорость $c$.`},
    {t: 'Фотоэффект', d: r`Вырывание электронов из вещества светом. Происходит, только если энергия фотона больше работы выхода.`},
    {t: 'Работа выхода', d: r`Минимальная энергия, нужная электрону для выхода из металла.`},
    {t: 'Красная граница фотоэффекта', d: r`Минимальная частота (максимальная длина волны), при которой ещё возможен фотоэффект.`},
    {t: 'Волны де Бройля', d: r`Любая частица с импульсом $p$ обладает длиной волны $\lambda=h/p$.`},
    {t: 'Соотношение неопределённостей Гейзенберга', d: r`Нельзя одновременно точно знать положение и импульс частицы: $\Delta x\,\Delta p\ge\hbar/2$.`},
    {t: 'Постулаты Бора', d: r`Электрон в атоме находится на дискретных стационарных орбитах без излучения. Излучение или поглощение — при переходе между уровнями.`},
    {t: 'Радиоактивный распад', d: r`Самопроизвольное превращение ядер. Число ядер убывает экспоненциально.`},
    {t: 'Период полураспада', d: r`Время, за которое распадается половина имеющихся ядер.`}
  ],
  formulas: [
    {n: 'Энергия фотона', f: r`E=h\nu=\frac{hc}{\lambda}`, d: r`$h=6{,}63\cdot10^{-34}$ Дж·с.`},
    {n: 'Импульс фотона', f: r`p=\frac h\lambda=\frac Ec`, d: r``},
    {n: 'Уравнение Эйнштейна для фотоэффекта', f: r`h\nu=A_{вых}+W_{k\max}`, d: r``},
    {n: 'Красная граница', f: r`\nu_{min}=\frac{A_{вых}}{h}`, d: r``},
    {n: 'Длина волны де Бройля', f: r`\lambda=\frac hp=\frac{h}{mv}`, d: r``},
    {n: 'Неопределённость', f: r`\Delta x\,\Delta p_x\ge\frac\hbar2,\quad\hbar=\frac h{2\pi}`, d: r``},
    {n: 'Уровни энергии водорода', f: r`E_n=-\frac{13{,}6\ \text{эВ}}{n^2}`, d: r``},
    {n: 'Излучение при переходе', f: r`h\nu=E_n-E_k`, d: r``},
    {n: 'Закон радиоактивного распада', f: r`N=N_0\cdot2^{-t/T_{1/2}}=N_0e^{-\lambda t}`, d: r`$\lambda=\ln2/T_{1/2}$.`}
  ],
  examples: [

GR.ode = [
  {title: 'Затухающие колебания x(t), x(0) = 1, ω₀ = 5 рад/с',
   x: {label: 't, с', min: 0, max: 6}, y: {label: 'x', min: -1.1, max: 1.1},
   params: [{id: 'b', label: 'Коэффициент затухания β', min: 0, max: 10, step: 0.25, val: 0.8, u: 'с⁻¹'}],
   series: [
     {name: 'x(t)', fn: (t, P) => {
        const w0 = 5, b = P.b, e = Math.exp(-b * t);
        if (b < w0 - 1e-9) { const w = Math.sqrt(w0 * w0 - b * b); return e * (Math.cos(w * t) + b / w * Math.sin(w * t)); }
        if (Math.abs(b - w0) < 1e-9) return (1 + b * t) * e;
        const g = Math.sqrt(b * b - w0 * w0); return e * (Math.cosh(g * t) + b / g * Math.sinh(g * t)); }, w: 2.6},
     {name: 'огибающая e^(−βt)', fn: (t, P) => P.b < 5 ? Math.exp(-P.b * t) : NaN},
     {name: '', fn: (t, P) => P.b < 5 ? -Math.exp(-P.b * t) : NaN, hideLegend: true}],
   cap: P => P.b < 5 ? 'β < ω₀: затухающие колебания с частотой ω = ' + Math.sqrt(25 - P.b * P.b).toFixed(2).replace('.', ',') + ' рад/с.' : (P.b === 5 ? 'β = ω₀: критическое затухание, колебаний нет.' : 'β > ω₀: апериодическое затухание, тело плавно возвращается к нулю.'),
   note: 'Сдвинь ползунок за значение 5 и колебания исчезнут.'}
];

var Charts=(function(){
var DASH=['','7 4','2 3','10 3 2 3'];
function fmt(v){
  if(!isFinite(v))return '—';
  var a=Math.abs(v);
  if(a!==0&&(a>=1e5||a<1e-3))return v.toExponential(1).replace('.',',').replace('e+','e');
  return String(+v.toPrecision(3)).replace('.',',');
}
function niceTicks(min,max,n){
  var step0=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),nm=step0/mag;
  var step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag,out=[],v=Math.ceil(min/step-1e-9)*step;
  for(;v<=max+step*1e-6;v+=step)out.push(+v.toPrecision(12));
  return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function sample(s,spec,P){
  if(s.pts)return typeof s.pts==='function'?s.pts(P):s.pts;
  var n=spec.n||260,o=[],a=spec.x.min,b=spec.x.max;
  for(var i=0;i<=n;i++){var x=a+(b-a)*i/n;o.push([x,s.fn(x,P)])}
  return o;
}
function valueAt(s,x,P){
  if(s.fn)return s.fn(x,P);
  var p=typeof s.pts==='function'?s.pts(P):s.pts;
  for(var i=1;i<p.length;i++){
    var a=p[i-1],b=p[i];
    if((x>=a[0]&&x<=b[0])||(x<=a[0]&&x>=b[0])){var dx=b[0]-a[0];return dx===0?b[1]:a[1]+(b[1]-a[1])*(x-a[0])/dx}
  }
  return NaN;
}

function mount(host,spec){
  var P={};(spec.params||[]).forEach(function(p){P[p.id]=p.val});
  var uid='c'+Math.random().toString(36).slice(2,8);

        '<input type="range" id="'+uid+p.id+'" data-p="'+p.id+'" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+p.val+'"></div>';
    }).join('')+'</div>';
  }
  if(named.length>1){
    h+='<div class="gr-leg">'+spec.series.map(function(s,i){
      if(!s.name||s.hideLegend)return '';
      return '<span><svg width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" class="s'+(i%4+1)+'" stroke-width="3" stroke-dasharray="'+DASH[i%4]+'"/></svg>'+esc(s.name)+'</span>';
    }).join('')+'</div>';
  }
  h+='<div class="gr-box"></div><div class="gr-ro" aria-live="off"></div>';

  var geo=null,data=null;

  function draw(){
    var W=Math.max(260,Math.floor(box.clientWidth||host.clientWidth||320));
    var H=Math.round(Math.min(340,Math.max(220,W*0.62)));
    var m={l:46,r:14,t:26,b:38},pw=W-m.l-m.r,ph=H-m.t-m.b;
    data=spec.series.map(function(s){return sample(s,spec,P)});
    var x0=spec.x.min,x1=spec.x.max,y0=spec.y.min,y1=spec.y.max;
    var a0=(y0==='auto'||y0===undefined),a1=(y1==='auto'||y1===undefined);
    if(a0||a1){
      var lo=0,hi=0;
      data.forEach(function(d){d.forEach(function(p){if(isFinite(p[1])){if(p[1]<lo)lo=p[1];if(p[1]>hi)hi=p[1]}})});
      var pad=(hi-lo||1)*0.08;
      if(a0)y0=lo<0?lo-pad:0;
      if(a1)y1=hi+pad;
    }
    var sx=function(x){return m.l+(x-x0)/(x1-x0)*pw},sy=function(y){return m.t+ph-(y-y0)/(y1-y0)*ph};
    var xt=niceTicks(x0,x1,W<420?5:8),yt=niceTicks(y0,y1,6),g='';
    yt.forEach(function(v){g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(v).toFixed(1)+'" y2="'+sy(v).toFixed(1)+'" stroke="var(--line)"/><text x="'+(m.l-6)+'" y="'+(sy(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>'});
    xt.forEach(function(v){g+='<line y1="'+m.t+'" y2="'+(m.t+ph)+'" x1="'+sx(v).toFixed(1)+'" x2="'+sx(v).toFixed(1)+'" stroke="var(--line)"/><text x="'+sx(v).toFixed(1)+'" y="'+(m.t+ph+16)+'" text-anchor="middle">'+fmt(v)+'</text>'});
    if(y0<0&&y1>0)g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(0).toFixed(1)+'" y2="'+sy(0).toFixed(1)+'" stroke="var(--muted)" stroke-opacity=".6"/>';
    if(x0<0&&x1>0)g+='<line y1="'+m.t+'" y2="'+(m.t+ph)+'" x1="'+sx(0).toFixed(1)+'" x2="'+sx(0).toFixed(1)+'" stroke="var(--muted)" stroke-opacity=".6"/>';
    g+='<line x1="'+m.l+'" x2="'+m.l+'" y1="'+m.t+'" y2="'+(m.t+ph)+'" stroke="var(--muted)"/><line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(m.t+ph)+'" y2="'+(m.t+ph)+'" stroke="var(--muted)"/>';
    g+='<text x="'+m.l+'" y="14" text-anchor="start">'+esc(spec.y.label)+'</text><text x="'+(W-m.r)+'" y="'+(H-6)+'" text-anchor="end">'+esc(spec.x.label)+'</text>';
    var lim=(y1-y0)*0.5,paths='';
    data.forEach(function(d,i){
      var s=spec.series[i],dd='',pen=false;
      d.forEach(function(p){
        var y=p[1];
        if(!isFinite(y)||y>y1+lim||y<y0-lim){pen=false;return}
        dd+=(pen?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(y).toFixed(1);pen=true;
      });

    });
    var notes=typeof spec.notes==='function'?spec.notes(P):(spec.notes||[]),nt='';
    notes.forEach(function(n){
      var px=sx(n.x),py=sy(n.y),right=px>W*0.62;

      nt+='<text x="'+(px+(right?-9:9)).toFixed(1)+'" y="'+(py-8).toFixed(1)+'" text-anchor="'+(right?'end':'start')+'" style="fill:var(--ink);font-weight:600">'+esc(n.t)+'</text>';
    });
    box.innerHTML='<svg class="gr-svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(spec.title)+'">'+
      '<defs><clipPath id="'+uid+'"><rect x="'+m.l+'" y="'+m.t+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs>'+g+
      '<g clip-path="url(#'+uid+')">'+paths+'</g>'+nt+'<g class="gr-hv"></g></svg>';
    geo={m:m,W:W,H:H,pw:pw,ph:ph,x0:x0,x1:x1,sx:sx,sy:sy,y0:y0,y1:y1};
    if(dyn)dyn.textContent=spec.cap(P);
    ro.textContent=spec.noHover?'':'Проведи пальцем или мышью по графику, чтобы увидеть значения.';
  }

  function hover(ev){

    var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*(geo.W/r.width);

      if(s.hideLegend)return;

      dots+='<circle cx="'+px.toFixed(1)+'" cy="'+geo.sy(y).toFixed(1)+'" r="4.5" class="s'+(i%4+1)+'f"/>';
    });

    ro.textContent=xs+' = '+fmt(x)+(parts.length?'  ·  '+parts.join('  ·  '):'');
  }

  host.addEventListener('input',function(e){

  host._draw=draw;draw();
}
return {mount:mount};

function parseAns(s){
  s=String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,'.').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g,function(c){return {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'}[c]||c});

  var m=s.match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?)(?:[*·x×]10\^?\(?([-+]?\d+)\)?)$/);
  if(m){var z=parseFloat(m[1])*Math.pow(10,parseInt(m[2],10));return Number.isFinite(z)?z:null}
  if(!/^[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?$/.test(s))return null;
  var v=Number(s);return Number.isFinite(v)?v:null;

function examPool(settings){
  var topics=cur().filter(function(t){
    if(settings.scope==='ticket')return !!t.ticket&&t.ticket===+settings.ticket;
    if(settings.scope==='main')return !!t.ticket;
    return true;
  }),out=[];
  topics.forEach(function(t){t.problems.forEach(function(p){out.push({t:t,p:p,k:pkey(t,p)})})});
  return out;
}
function startExam(){
  var cfg=U.exam.settings,selectedTicket=null,runCfg=cfg;
  if(cfg.scope==='random-ticket'){var ticketTopics=cur().filter(function(t){return !!t.ticket});if(!ticketTopics.length){app.innerHTML='<div class="panel"><p>Не удалось найти билеты.</p><button class="btn" data-a="exam-home">Назад</button></div>';return}selectedTicket=ticketTopics[Math.floor(Math.random()*ticketTopics.length)].ticket;runCfg=Object.assign({},cfg,{scope:'ticket',ticket:selectedTicket})}
  var pool=examPool(runCfg);
  if(!pool.length){app.innerHTML='<div class="panel"><p>Для выбранного режима нет задач.</p><button class="btn" data-a="exam-home">Назад</button></div>';return}
  var theoryTopics=cur().filter(function(t){if(runCfg.scope==='ticket')return !!t.ticket&&t.ticket===+runCfg.ticket;if(runCfg.scope==='main')return !!t.ticket;return true}).filter(function(t){return t.defs&&t.defs.length});
  if(!theoryTopics.length)theoryTopics=cur().filter(function(t){return t.defs&&t.defs.length});
  var theoryTopic=PICK(theoryTopics),theoryDef=PICK(theoryTopic.defs);
  var ticketFormat=runCfg.scope==='ticket',count=Math.min(Math.max(1,ticketFormat?2:(+cfg.count||10)),pool.length);
  if(runCfg.scope==='main'){
    var buckets={};pool.forEach(function(x){var key=String(x.t.ticket);(buckets[key]||(buckets[key]=[])).push(x)});
    Object.keys(buckets).forEach(function(k){shuffle(buckets[k])});
    var balanced=[],keys=shuffle(Object.keys(buckets));
    while(balanced.length<count){var added=false;keys.forEach(function(k){if(buckets[k].length&&balanced.length<count){balanced.push(buckets[k].pop());added=true}});if(!added)break}
    pool=balanced;
  } else shuffle(pool);
  var tasks=pool.slice(0,count).map(function(x){var I;try{I=inst(x.t,x.p)}catch(e){I={q:'Не удалось создать задачу',a:NaN,u:'',steps:[]}}return {t:x.t,p:x.p,k:x.k,I:I,answer:'',correct:null,skipped:false,review:false}});
  U.exam.session={tasks:tasks,index:0,stage:'theory',theory:{t:theoryTopic,def:theoryDef,answer:'',skipped:false},started:Date.now(),duration:cfg.timed?Math.max(1,+cfg.minutes||20)*60*1000:0,finished:false,expired:false,selectedTicket:selectedTicket,ticketFormat:ticketFormat};
  renderExam();if(U.exam.session.duration)startExamClock();
}

function scoreExamTask(task){
  var raw=String(task.answer||'').trim(),v=parseAns(raw),a=Number(task.I.a),tol=task.I.tol||(task.p.gen?0.02:0.01);
  task.correct=raw!==''&&v!==null&&isFinite(a)&&Math.abs(v-a)<=Math.max(Math.abs(a)*tol,1e-10);
}
function saveCurrentExamInput(){var se=U.exam.session;if(!se||se.stage!=='problems')return;var task=se.tasks[se.index],inp=document.getElementById('examAnswer');if(!inp)return;var raw=inp.value.trim();if(task.skipped&&!raw)return;task.answer=raw;task.correct=null;task.skipped=false}
function examAnswer(skip){
  var se=U.exam.session;if(!se||se.finished)return;
  var task=se.tasks[se.index],inp=document.getElementById('examAnswer'),raw=inp?inp.value.trim():(task.answer||'');
  task.answer=skip?'':raw;task.skipped=!!skip;task.correct=null;
  if(!skip)scoreExamTask(task);
  if(se.index<se.tasks.length-1){se.index++;renderExam()}else finishExam();
}
function examPrevious(){var se=U.exam.session;if(!se||se.finished||se.index<=0)return;saveCurrentExamInput();se.index--;renderExam()}

function finishExam(){var se=U.exam.session;if(!se||se.finished)return;if(se.stage==='theory'&&se.theory){var ti=document.getElementById('examTheoryAnswer');if(ti)se.theory.answer=ti.value.trim()}saveCurrentExamInput();se.tasks.forEach(function(t){if(t.correct===null&&!t.skipped)scoreExamTask(t)});se.finished=true;se.finishedAt=Date.now();if(U.exam.clock)clearInterval(U.exam.clock);renderExamResults()}

/* ---------- Прогресс ---------- */
function countSubject(sj){
  var tf=0,tk=0,tp=0,ts=0;
  sj.topics.forEach(function(t){
    tf+=t.formulas.length+t.defs.length;tp+=t.problems.length;
    t.formulas.forEach(function(f){if(S.known[ckey(t,'f',f)])tk++});
    t.defs.forEach(function(d){if(S.known[ckey(t,'d',d)])tk++});
    t.problems.forEach(function(p){if(S.solved[pkey(t,p)])ts++});
  });
  return {tf:tf,tk:tk,tp:tp,ts:ts};
}
function practiceAnalyticsHTML(){
  var totals={attempts:0,wrong:0,hints:0,solved:0},errs={formula:0,sign:0,units:0,arithmetic:0,concept:0};
  Object.keys(S.problemStats||{}).forEach(function(k){var x=S.problemStats[k]||{};['attempts','wrong','hints','solved'].forEach(function(n){totals[n]+=Number(x[n])||0});Object.keys(errs).forEach(function(n){errs[n]+=(x.errors&&Number(x.errors[n]))||0})});
  var labels={formula:'формула',sign:'знак',units:'единицы',arithmetic:'арифметика',concept:'физический смысл'};
  var top=Object.keys(errs).sort(function(a,b){return errs[b]-errs[a]}).filter(function(k){return errs[k]>0}).slice(0,3).map(function(k){return labels[k]+': '+errs[k]}).join(' · ');
  return '<p class="lead">Попыток: '+totals.attempts+' · неверных: '+totals.wrong+' · подсказок: '+totals.hints+' · задач решено: '+totals.solved+'</p><p class="muted">Отмеченные причины затруднений: '+esc(top||'пока нет — после неверного ответа можно указать тип затруднения')+'.</p>';
}
function renderProg(){
  var sj=subj(),c=countSubject(sj),rows='';
  sj.topics.forEach(function(t){
    var f=t.formulas.length+t.defs.length,k=0,s=0;
    t.formulas.forEach(function(x){if(S.known[ckey(t,'f',x)])k++});
    t.defs.forEach(function(x){if(S.known[ckey(t,'d',x)])k++});
    t.problems.forEach(function(p){if(S.solved[pkey(t,p)])s++});
    var p=t.problems.length;
    rows+='<div class="prog"><div class="nm">'+esc(tlabel(t))+'</div>'+
      '<div><span class="count">карточки '+k+'/'+f+'</span><div class="meter"><i style="width:'+Math.round(k/f*100)+'%"></i></div></div>'+
      '<div><span class="count">задачи '+s+'/'+p+'</span><div class="meter"><i style="width:'+Math.round(s/p*100)+'%"></i></div></div></div>';
  });
  var all=SUBJECTS.map(function(s){var x=countSubject(s);return '<div class="prog" style="grid-template-columns:minmax(0,1fr) auto auto"><div class="nm">'+esc(s.title)+'</div><span class="count">карточки '+x.tk+'/'+x.tf+'</span><span class="count">задачи '+x.ts+'/'+x.tp+'</span></div>'}).join('');
  app.innerHTML='<div class="stack">'+
    (sj.topics.length?'<div class="tiles"><div class="panel"><div class="count">Карточки · '+esc(sj.short)+'</div><div class="big-n">'+c.tk+' / '+c.tf+'</div></div>'+
    '<div class="panel"><div class="count">Задачи · '+esc(sj.short)+'</div><div class="big-n">'+c.ts+' / '+c.tp+'</div></div></div>'+
    '<div class="panel"><h3 style="margin-bottom:6px">По темам</h3>'+rows+'</div>':emptyHTML())+
    '<div class="panel"><h3 style="margin-bottom:6px">Аналитика практики</h3>'+practiceAnalyticsHTML()+'</div>'+
    '<div class="panel"><h3 style="margin-bottom:6px">Все предметы</h3>'+all+'</div>'+

}

  else if(a==='exam-prev'){examPrevious()}
  else if(a==='exam-review'){examToggleReview()}
  else if(a==='exam-abort'){if(confirm('Завершить экзамен и показать результаты?'))finishExam()}
  else if(a==='exam-home'){if(U.exam.session&&!U.exam.session.finished&&confirm('Выйти из текущего экзамена? Ответы этой попытки будут потеряны.')){if(U.exam.clock)clearInterval(U.exam.clock);U.exam.session=null;examHome()}else if(!U.exam.session||U.exam.session.finished){U.exam.session=null;examHome()}}
  else if(a==='exam-retry'){U.exam.session=null;examHome()}
  else if(a==='math-sec'){U.mathSec=id;render()}
  else if(a==='reset-ask'){U.resetAsk=true;render()}
  else if(a==='reset-no'){U.resetAsk=false;render()}
  else if(a==='reset-yes'){S.known={};S.solved={};S.cardStats={};S.problemStats={};U.resetAsk=false;U.cards._built=false;save();render()}
});
document.addEventListener('change',function(e){
  var el=e.target,s=el.getAttribute&&el.getAttribute('data-sel');
  if(el.id==='examScope'){U.exam.settings.scope=el.value;var w=document.getElementById('examTicketWrap');if(w)w.hidden=el.value!=='ticket';var cw=document.getElementById('examCountWrap');if(cw)cw.hidden=el.value==='ticket'||el.value==='random-ticket'}
  else if(el.id==='examTicket')U.exam.settings.ticket=+el.value;
  else if(el.id==='examCount')U.exam.settings.count=+el.value;
  else if(el.id==='examMinutes')U.exam.settings.minutes=+el.value;
  else if(el.id==='examTimed')U.exam.settings.timed=el.checked;
  else if(s==='notes-topic'){setTopic(el.value);U.q='';render()}
  else if(s==='prob-topic'){U.prob={topic:el.value,rkey:null};if(el.value!=='random')setTopic(el.value);render()}
  else if(el.hasAttribute&&el.hasAttribute('data-ticket')){
    var tn=+el.getAttribute('data-ticket'),ts=cur().filter(function(t){return !!t.ticket}).map(function(t){return t.ticket});
    var sel=U.cards.tickets?U.cards.tickets.slice():ts.slice();
    if(el.checked){if(sel.indexOf(tn)===-1)sel.push(tn)}else sel=sel.filter(function(x){return x!==tn});
    sel.sort(function(a,b){return a-b});U.cards.tickets=sel.length===ts.length?null:sel;U.cards.pickerOpen=true;U.cards._built=false;buildDeck();render();
  }
  else if(el.getAttribute&&el.getAttribute('data-a')==='card-unk'){U.cards.unknown=el.checked;buildDeck();render()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='search'){U.q=e.target.value;var b=document.getElementById('notesBody');if(b){b.innerHTML=notesBody();typeset(b);mountGraphs(b)}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.hasAttribute&&e.target.hasAttribute('data-ans'))check(e.target.getAttribute('data-ans'));
});
var rz=null;
window.addEventListener('resize',function(){
  clearTimeout(rz);rz=setTimeout(function(){document.querySelectorAll('[data-gr]').forEach(function(h){if(h._draw)h._draw()})},150);
});
render();
})();
</script>
</body>
</html>
